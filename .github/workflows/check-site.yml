# Vérifications du site — le filet de sécurité avant publication.
#
# Deux incidents en production ont motivé ce workflow :
#   - 4 août 2026 : une apostrophe droite dans une chaîne JS a tué le script de
#     metiers.html — la page s'affichait, l'onglet Métiers restait VIDE ;
#   - 5 août 2026 : toutes les armes du BiS s'affichaient en case vide, leur art
#     n'étant pas embarqué.
# Les deux étaient invisibles à la relecture du code et visibles en une seconde
# dans un navigateur : d'où l'ouverture réelle des pages ci-dessous.
#
# Ce workflow tourne sur chaque push et chaque PR. La publication (deploy.yml)
# l'appelle AVANT de publier, une seule fois pour les deux destinations : un
# site cassé ne part plus en ligne.

name: Vérifier le site

on:
  # Sur main, c'est la publication qui appelle ces vérifications (voir
  # workflow_call plus bas) : inutile de les jouer deux fois.
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch: {}
  workflow_call: {}   # appelé une seule fois par deploy.yml

jobs:
  check:
    runs-on: ubuntu-latest
    # Filet de dernier recours. Sans limite, GitHub laisse tourner 6 h — et
    # comme la publication passe par ce contrôle et que « Publier le site » est
    # en file d'attente unique, une étape figée bloque TOUTE publication
    # pendant ce temps. Vécu le 19 août 2026 : le passage de 7 h 10 est resté
    # figé sur l'installation de Chromium, et les notes de la v0.39.0 sont
    # restées invisibles sur le site pendant des heures alors qu'elles étaient
    # prêtes et poussées. 15 min suffisent très largement — un passage nominal
    # en prend moins de 3.
    timeout-minutes: 15
    steps:
      - name: Checkout du site
        uses: actions/checkout@v4

      # Les pages lisent les données du Codex ; sans elles, la moitié des
      # contrôles (noms français, références, icônes) ne voudrait rien dire.
      - name: Checkout de la knowledge base
        uses: actions/checkout@v4
        with:
          repository: Reptile-New/wocc-knowledge-base
          path: wocc-knowledge-base

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntaxe des scripts embarqués
        run: python3 scripts/check_inline_js.py

      - name: Références du Codex (existence et non-ambiguïté)
        run: python3 scripts/check_codex_refs.py wocc-knowledge-base/data

      # 7-9 août 2026 : le choix des branches de release du jeu, écrit en ligne
      # dans update-upcoming.yml, plantait sur les vieilles branches sans
      # numéro de version — panne toutes les 2 h, découverte deux jours plus
      # tard par mail. Le code vit maintenant dans un script, rejoué ici.
      - name: Sélection des branches de release (auto-test)
        run: python3 scripts/pick_release_branches.py --self-test

      # Non bloquant : une description non traduite dégrade l'affichage (repli
      # sur l'anglais) mais ne casse rien. C'est un rappel pour la Routine
      # éditoriale, pas un motif de refuser une publication.
      - name: Traductions françaises des fiches (rappel)
        continue-on-error: true
        run: python3 scripts/check_codex_fr.py wocc-knowledge-base/data

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 16 août 2026 : un joueur signale que la rotation du Paladin propose
      # encore cinq sorts retirés du grimoire à la refonte v0.36. Rien ne
      # pouvait le voir — les noms des guides sont rendus par JavaScript, et un
      # sort retiré garde sa fiche Codex. Ce contrôle relit tout ce qui est
      # écrit à la main sur le site : les 36 builds (Builds + PvP), le tableau
      # d'enchantements et celui des montures, confrontés aux données du jeu.
      - name: Guides écrits à la main (rotations, enchantements, montures)
        run: node scripts/check_guides.mjs --kb wocc-knowledge-base

      # `--with-deps` fait deux choses très différentes : installer des paquets
      # système par apt, puis télécharger le navigateur. La première moitié
      # dépend d'un miroir Ubuntu qui peut cesser de répondre SANS jamais rendre
      # la main — apt attend alors indéfiniment. C'est ce qui est arrivé le
      # 19 août 2026 : 6 h figées ici, et toute la file de publication bloquée
      # derrière. On sépare donc les deux moitiés : celle des paquets est bornée
      # et tolérée en échec, celle du navigateur reste obligatoire. Si des
      # bibliothèques manquent vraiment, rien n'est passé sous silence :
      # Chromium refusera de démarrer et l'étape suivante échouera bruyamment.
      - name: Installer Chromium
        timeout-minutes: 8
        run: |
          npm install --no-save playwright@1.62.1
          timeout 300 npx playwright install-deps chromium \
            || echo "::warning::paquets système non installés (miroir injoignable) — on poursuit avec le navigateur seul"
          npx playwright install chromium

      - name: Ouvrir les pages dans un navigateur
        run: node scripts/check_pages.mjs --kb wocc-knowledge-base
