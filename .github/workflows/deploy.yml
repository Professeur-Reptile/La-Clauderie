# Publication du site sur laclauderie.fr (VPS IONOS 31.70.172.141, tar+SSH).
#
# Historique : publication par FTP sur l'hébergement OVH jusqu'en 2026-11
# (voir l'historique de ce fichier), puis bascule du domaine sur le VPS.
# Le miroir GitHub Pages, retiré le 6 août 2026 (artefact ~17 Mo, 2
# publications sur 3 échouaient), n'a pas été ressuscité.
#
# Prérequis : secret DEPLOY_SSH_KEY = clé privée dont la partie publique
# est installée sur le VPS avec une commande forcée « deploy-tar »
# (le serveur n'exécute rien d'autre avec cette clé).
#
# IMPORTANT : ce repo est la source de vérité. Les JSON édités en ligne
# (admin.html passe par l'API GitHub) et les JSON mis à jour par les
# workflows planifiés (classement guilde, BiS, à venir) arrivent sur main,
# puis ce workflow les pousse vers le VPS.

name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    # Rafraîchit la copie du Codex embarquée sur le VPS (les données sont
    # régénérées de leur côté, dans wocc-knowledge-base).
    - cron: '23 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# Une publication à la fois : deux envois simultanés sur le même dossier
# se marcheraient dessus.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Un site cassé ne doit pas partir en ligne.
  checks:
    uses: ./.github/workflows/check-site.yml

  vps:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier que le secret de déploiement est configuré
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Secret DEPLOY_SSH_KEY manquant. Settings → Secrets and variables → Actions (voir le commentaire en tête de ce fichier)."
            exit 1
          fi

      # Le Codex vit dans son propre repo (public) ; on l'embarque tel quel.
      - name: Checkout du Codex (wocc-knowledge-base)
        uses: actions/checkout@v4
        with:
          repository: Reptile-New/wocc-knowledge-base
          path: wocc-knowledge-base

      # Toutes les pages et données de la racine, plus le .htaccess
      # (redirections HTTPS/www), le robots.txt et la copie du Codex.
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp *.html *.json _site/
          cp sw.js robots.txt _site/
          cp -r assets _site/assets
          cp -r notes _site/notes
          cp .htaccess _site/.htaccess
          # Codex : la page sous /codex/, les JSON sous /data/ (la page les
          # charge en relatif via « ../data/ », comme sur GitHub Pages).
          cp -r wocc-knowledge-base/site _site/codex
          cp -r wocc-knowledge-base/data _site/data
          # Sitemap généré sur le site assemblé : toujours celui qui part en
          # ligne (annoncé dans robots.txt, lu par Google).
          python3 scripts/build_sitemap.py _site > _site/sitemap.xml

      - name: Déployer sur le VPS (tar + SSH)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '31.70.172.141 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAX2+4Kl4cmZo6Zed95rS9C34NKiXYjPf/l36IXmtRLC' > ~/.ssh/known_hosts
          tar -C _site -cpf - . | ssh -i ~/.ssh/deploy_key -o BatchMode=yes root@31.70.172.141 "deploy-tar clauderie"
