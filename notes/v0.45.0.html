<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Nouveautés v0.45.0 — La Clauderie</title><meta name="description" content="La v0.45.0, la plus grosse mise à jour du jeu : toutes les villes et cinq donjons reconstruits, l'abonnement Adhésion (achats pas encore ouverts), un cadeau de sortie (redesign d'apparence + verrouillages remis à zéro), le druide Groveheart réinventé, le chasseur refondu, les montures cosmétiques et Amélioration/farouche passés à la Force."><meta name="theme-color" content="#c8a04b"><meta property="og:type" content="website"><meta property="og:site_name" content="La Clauderie"><meta property="og:title" content="Nouveautés v0.45.0 — La Clauderie"><meta property="og:url" content="https://laclauderie.fr/notes/v0.45.0.html"><link rel="canonical" href="https://laclauderie.fr/notes/v0.45.0.html"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icon-180.png"><script src="../assets/pwa.js" defer></script><script>if(localStorage.getItem('lang')==='en')location.replace('v0.45.0.en.html'+location.hash);</script><style>
  :root {
    --bg: #0b0d12; --bg-card: #161a24; --bg-card-hover: #1a1f2b; --bg-modal: #12161f;
    --line: #262c3a; --line-soft: #1e2431;
    --gold: #c8a04b; --gold-bright: #e6c37a;
    --text: #dfe3ea; --dim: #8b93a3; --faint: #5b6272;
    --q-rare: #2f8bff; --q-epic: #a335ee; --q-legendary: #ff8000;
    --dps: #e5544a; --heal: #58c46a; --arcane: #58b6c9; --discord: #5865f2;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    line-height: 1.55; -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 900px 460px at 15% -8%, rgba(200,160,75,0.09), transparent 70%),
      radial-gradient(ellipse 760px 400px at 88% -4%, rgba(47,139,255,0.06), transparent 70%);
  }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 28px); }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-soft); }
  .topbar .row { max-width: 960px; margin: 0 auto; padding: 8px clamp(16px,4vw,28px); display: flex; align-items: center; gap: 14px; min-height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .sigil { width: 26px; height: 30px; flex: none; background: linear-gradient(160deg, var(--gold-bright), var(--gold) 55%, #8a6d2e); clip-path: polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%); display: grid; place-items: center; color: #1a130a; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; }
  .brand b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .topnav { margin-left: auto; display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; font-size: 0.88rem; }
  .topnav a { color: var(--dim); text-decoration: none; }
  .topnav a:hover { color: var(--gold-bright); }
  .topnav .cur { color: var(--gold-bright); font-weight: 600; }
  @media (max-width: 620px) { .brand b { display: none; } .topnav { gap: 4px 11px; font-size: 0.82rem; } }

  /* Hero */
  .hero { padding: clamp(40px, 7vw, 72px) 0 clamp(24px, 4vw, 40px); border-bottom: 1px solid var(--line-soft); }
  .eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.4rem, 7vw, 3.8rem); line-height: 1; margin: 0 0 12px; }
  h1 .v { color: var(--gold-bright); }
  .lede { color: var(--dim); font-size: clamp(1rem, 2.2vw, 1.2rem); max-width: 58ch; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--faint); }
  .meta b { color: var(--dim); }
  .hint { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; background: color-mix(in srgb, var(--gold) 10%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); color: var(--gold-bright); padding: 8px 14px; border-radius: 8px; font-size: 0.86rem; }

  /* Sections */
  section { padding: clamp(26px, 4vw, 40px) 0; border-top: 1px solid var(--line-soft); scroll-margin-top: 72px; }
  section:first-of-type { border-top: none; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .sec-num { font-family: var(--font-mono); color: var(--gold); font-size: 0.82rem; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 3.6vw, 2.1rem); margin: 0; }
  .sec-sub { color: var(--dim); margin: -8px 0 20px; max-width: 66ch; }

  .grid { display: grid; gap: 13px; }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .cols-3 { grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); }

  .card { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; padding: 19px; }
  .card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.14rem; margin: 0 0 6px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .card p { margin: 6px 0 0; color: var(--dim); font-size: 0.93rem; }
  .card ul { margin: 10px 0 0; padding-left: 1.05em; color: var(--dim); font-size: 0.9rem; }
  .card ul li { margin: 4px 0; }
  .card ul li::marker { color: var(--gold); }

  /* Bandeau « En un coup d'œil » — mêmes rubriques, même ordre, à chaque
     version : le lecteur prend l'habitude et trouve sa classe sans lire. */
  .digest { padding: clamp(24px, 3.5vw, 34px) 0 clamp(2px, 1vw, 8px); }
  .digest h2 { font-size: clamp(1.2rem, 2.8vw, 1.5rem); margin: 0 0 6px; }
  .digest .sec-sub { margin: 0 0 16px; }
  .digest ol { list-style: none; margin: 0; padding: 0; background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; overflow: hidden; }
  .digest li { display: grid; grid-template-columns: 30px 215px 1fr; align-items: baseline; gap: 3px 12px; padding: 13px 17px; border-top: 1px solid var(--line-soft); }
  .digest li:first-child { border-top: none; }
  .d-ico { font-size: 0.98rem; }
  .d-name { font-weight: 600; color: var(--text); text-decoration: none; }
  a.d-name:hover, a.d-name:focus-visible { color: var(--gold-bright); }
  .d-say { color: var(--dim); font-size: 0.92rem; }
  .digest li.none .d-name, .digest li.none .d-say { color: var(--faint); font-weight: 400; }
  /* Sens du changement, d'un coup d'œil : amélioration, nerf, inchangé. */
  .up { color: var(--heal); font-weight: 600; white-space: nowrap; }
  .down { color: var(--dps); font-weight: 600; white-space: nowrap; }
  .eq { color: var(--dim); font-weight: 600; white-space: nowrap; }
  @media (max-width: 620px) {
    .digest li { grid-template-columns: 26px 1fr; padding: 12px 15px; }
    .d-say { grid-column: 2; }
  }

  /* Clickable cards */
  .card.more { cursor: pointer; transition: border-color .15s, transform .15s, background .15s; position: relative; }
  .card.more:hover { border-color: var(--gold); transform: translateY(-2px); background: var(--bg-card-hover); }
  .card.more:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .more-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; color: var(--gold-bright); font-size: 0.82rem; font-weight: 600; }
  .more-link::after { content: "→"; transition: transform .15s; }
  .card.more:hover .more-link::after { transform: translateX(3px); }

  /* Chips */
  .chip { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; font-weight: 600; white-space: nowrap; }
  .c-new { color: var(--heal); } .c-raid { color: var(--gold); } .c-pvp { color: var(--dps); }
  .c-bal { color: var(--q-legendary); } .c-mob { color: var(--arcane); } .c-epic { color: var(--q-epic); }
  .c-plate { color: var(--dps); } .c-leather { color: var(--heal); } .c-cloth { color: var(--arcane); } .c-util { color: var(--q-rare); }

  .statline { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim); }
  .statline b { color: var(--text); }
  .grp-title { font-family: var(--font-display); font-size: 1rem; color: var(--dim); margin: 22px 0 12px; }
  .compact { columns: 2; column-gap: 34px; }
  .compact li { margin: 5px 0; }
  @media (max-width: 560px) { .compact { columns: 1; } }
  strong.hl { color: var(--text); font-weight: 600; }

  /* Modal */
  dialog { padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-modal); color: var(--text); max-width: 640px; width: calc(100% - 28px); max-height: 86vh; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  dialog::backdrop { background: rgba(4,6,10,0.72); backdrop-filter: blur(3px); }
  .modal-head { position: sticky; top: 0; background: linear-gradient(180deg, var(--bg-modal), color-mix(in srgb, var(--bg-modal) 88%, transparent)); border-bottom: 1px solid var(--line-soft); padding: 18px 22px; display: flex; align-items: flex-start; gap: 14px; }
  .modal-head h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; margin: 0; line-height: 1.15; }
  .modal-head .close { margin-left: auto; flex: none; background: var(--bg-card); border: 1px solid var(--line); color: var(--dim); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .modal-head .close:hover { color: var(--text); border-color: var(--gold); }
  .modal-body { padding: 20px 22px 26px; overflow-y: auto; }
  .modal-body .summary { color: var(--dim); font-style: italic; margin: 0 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
  .modal-body h4 { font-family: var(--font); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-bright); margin: 22px 0 8px; }
  .modal-body h4:first-of-type { margin-top: 0; }
  .modal-body p { margin: 0 0 10px; font-size: 0.94rem; color: var(--text); }
  .modal-body ul { margin: 0 0 10px; padding-left: 1.15em; }
  .modal-body li { margin: 6px 0; font-size: 0.93rem; }
  .modal-body li::marker { color: var(--gold); }
  .modal-body b { color: var(--gold-bright); font-weight: 600; }
  .kbd { font-family: var(--font-mono); background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 0.85em; color: var(--text); }

  .note { margin-top: 8px; background: color-mix(in srgb, var(--gold) 8%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 11px; padding: 16px 19px; color: var(--dim); font-size: 0.94rem; }
  .note b { color: var(--gold-bright); }

  footer { border-top: 1px solid var(--line-soft); padding: 28px 0 54px; color: var(--faint); font-size: 0.82rem; text-align: center; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--gold-bright); }

<body><div class="topbar"><div class="row"><a href="../index.html" class="brand"><span class="sigil">C</span><b>La Clauderie</b></a><nav class="topnav" data-guild-nav data-current="news" aria-label="Navigation du site"></nav></div></div><div class="wrap"><header class="hero"><p class="eyebrow">World of ClaudeCraft · Notes de version</p><h1>Nouveautés <span class="v">v0.45.0</span></h1><p class="lede">La <strong class="hl">plus grosse mise à jour</strong> du jeu à ce jour : le monde est reconstruit à la main — toutes les villes, cinq donjons —, un système d’<strong class="hl">adhésion</strong> attend ses achats, chaque personnage existant reçoit un <strong class="hl">cadeau de sortie</strong>, et côté combat le druide soigneur se réinvente, le chasseur est refondu, et Amélioration comme farouche passent à la <strong class="hl">Force</strong>.</p><div class="meta"><span><b>Publiée</b> le 25 octobre 2026</span><span><b>Depuis</b> v0.44.7</span><span><b>Majeure</b></span></div><div class="hint">💡 Clique sur une carte pour le détail.</div></header><nav class="digest" aria-labelledby="digest-title"><h2 id="digest-title">En un coup d’œil</h2><p class="sec-sub">Les mêmes rubriques à chaque version, dans le même ordre.</p><ol><li class=""><span class="d-ico">⚔️</span><a class="d-name" href="#classes">Classes &amp; sorts</a><span class="d-say"><b class="up">Groveheart ↑</b> forme Sporemender ; <b class="up">chasseur ↑</b> sans portée minimale ; <b class="down">Force =</b> Amélioration et farouche requalifiés.</span></li><li class=""><span class="d-ico">🔨</span><a class="d-name" href="#metiers">Métiers &amp; récolte</a><span class="d-say"><b class="up">Qualité ↑</b> permanente sur le butin gagné (+2 niv. objet par palier) ; réactifs signés en Chambre forte.</span></li><li class=""><span class="d-ico">🐉</span><a class="d-name" href="#donjons">Donjons, failles &amp; boss</a><span class="d-say">Cinq donjons reconstruits ; <b class="up">marques héroïques ↑</b> devenues une monnaie ; le Carquois infernal.</span></li><li class=""><span class="d-ico">🗺️</span><a class="d-name" href="#monde">Monde &amp; quêtes</a><span class="d-say">Treize villes à la main ; mobs à l’échelle par niveau ; <b class="up">2 quêtes mondiales ↑</b> à 150 Honor/jour.</span></li><li class=""><span class="d-ico">🏰</span><a class="d-name" href="#guilde">Guilde &amp; social</a><span class="d-say">Le Hall des Lanternes ; recrutement de donjon unifié ; mot du royaume.</span></li><li class=""><span class="d-ico">⚙️</span><a class="d-name" href="#confort">Confort &amp; technique</a><span class="d-say"><b class="up">Montures ↑</b> cosmétiques + rangs d’équitation ; première personne ; cadeaux de sortie ; Adhésion en approche.</span></li></ol></nav><section id="classes"><h2><span class="num">01</span>Classes &amp; sorts</h2><p class="sec-sub">Deux refontes majeures, une inversion de stats primaires, et un bouquet d’ajustements : le méta change.</p><div class="grid cols-2"><div class="card more" data-detail="groveheart" tabindex="0" role="button"><h3>Groveheart : la forme Sporemender <span class="chip c-new">Nouveau</span></h3><p>Le druide soigneur gagne sa signature visible : la forme <b>Sporemender</b> avec modèle animé dédié, <b>Spore Burst</b> (soin posé au sol qui éclabousse), Typhoon qui projette en l’air — et Wildbloom rebaptisée Sporemending.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="chasseur" tabindex="0" role="button"><h3>Chasseur : le grand rework <span class="chip c-bal">Équilibrage</span></h3><p>Incantations en mouvement, zones instantanées, un nouveau <b>Scatterbolt</b> et le <b>Play Dead</b> inédit ; Fieldcraft refondu — et plus <b>aucune portée minimale</b> : la zone morte d’Auto Shot disparaît complètement.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="force" tabindex="0" role="button"><h3>Amélioration et farouche passent à la Force <span class="chip c-bal">Équilibrage</span></h3><p>Une table unique de stat primaire pour les neuf classes : un félin ne gagne <b>rien</b> de l’Agilité, un ours 1,5 de puissance par point — leurs objets tombent désormais avec de la <b>Force</b>.</p><span class="more-link">Voir le détail</span></div><div class="card"><h3>Rogue, guerrier, shaman <span class="chip c-bal">Équilibrage</span></h3><p><b>Skulduggery +25 %</b> (et le 2 pièces Brawlmark perdant son bonus Swift Heels) avec un passe mobilité-énergie-cooldowns pour le rogue ; <b>Iron Resolve</b> bouclier 20 % des PV max pour le guerrier ; le kit Thundercall du shaman rebalancé (Lava Flows, Cinder Jolt à 27 s). Et toute classe avec une incantation retardable gagne l’anti-repoussure à 2 pièces de set PvP.</p></div></div></section><section id="metiers"><h2><span class="num">02</span>Métiers &amp; récolte</h2><p class="sec-sub">La qualité de butin quitte l’expérimentation pour devenir un système permanent, et la Chambre forte entre dans la fabrication.</p><div class="grid cols-2"><div class="card"><h3>La qualité s’installe <span class="chip c-new">Nouveau</span></h3><p>Environ <b>10 %</b> des armes, armures et main gauche non commune que tu gagnes roulent un palier de qualité (1 à 4) : <b>+2 niveaux d’objet par palier</b>, et un tirage de poids de stats propre à l’objet. C’est <b>permanent</b>, sur toutes les sources de récompenses gagnées — et la ligne de chat d’une fabrication nomme désormais la qualité sortie.</p></div><div class="card"><h3>Chef-d’œuvre en Chambre forte <span class="chip c-new">Nouveau</span></h3><p>Les <b>réactifs signés</b> déposés dans la Chambre forte comptent pour le chef-d’œuvre (masterwork), et les consommables fabriqués s’empilent entre artisans différents. Le motif d’une recette dit ce qu’il fabrique au survol, et <b>Prime Cut</b> rejoint le pool de matériaux du coffre du Trésor enterré.</p></div></div></section><section id="donjons"><h2><span class="num">03</span>Donjons, failles &amp; boss</h2><p class="sec-sub">Le gros chantier de la version : cinq donjons reconstruits en terrains ouverts scénographiés, et l’économie héroïque refondue.</p><div class="grid cols-2"><div class="card more" data-detail="donjons" tabindex="0" role="button"><h3>Cinq donjons reconstruits <span class="chip c-new">Nouveau</span></h3><p>Le <b>Hollow Crypt</b>, le <b>Sunken Bastion</b>, le <b>Drowned Temple</b>, le <b>Wildheart Basin</b> et le <b>Gravewyrm Sanctum</b> sont refaits en décors ouverts bâtis à la main, avec entrées dans le monde et un guide de boss intégré pour chaque donjon à cinq.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="marques" tabindex="0" role="button"><h3>Marques héroïques : la monnaie <span class="chip c-new">Nouveau</span></h3><p>Les <b>Heroic Marks</b> quittent le sac pour ta bourse : plus de débordement perdu, un solde qui s’affiche et se dépense. Et un final héroïque paie mieux : 10 po en donjon à cinq, 20 po en raid.</p><span class="more-link">Voir le détail</span></div><div class="card"><h3>Le Carquois infernal <span class="chip c-epic">Butin</span></h3><p>Le Crucible de Varkhul en héroïque lâche un nouveau carquois épique (2,5 %) : <b>7 Agi / 4 End, Critique 25 + Toucher 50</b> — le seul offhand Toucher du Crucible. Le butin des boss s’affiche enfin pour tout le groupe au moment du kill, et les pièces de <b>soigneur</b> du Crucible troquent le Toucher contre le Critique (ceintures mises à part).</p></div><div class="card"><h3>La Chambre forte filtre <span class="chip c-util">Ajustement</span></h3><p>La Chambre forte hebdomadaire ne propose plus que du stuff de <b>ta classe</b>, avec un <b>focus spécialisation</b> en option ; les <b>sceaux de raid</b> appariés à ta classe et les <b>Cœurs du Crucible</b> entrent dans les récompenses, et la rangée PvP ne sort que du Season 2 de ta classe.</p></div></div></section><section id="monde"><h2><span class="num">04</span>Monde &amp; quêtes</h2><p class="sec-sub">Tout le monde ouvert est repensé : villes à la main, difficulté à l’échelle, et l’Honor débarque dans les quêtes mondiales.</p><div class="grid cols-2"><div class="card"><h3>Treize villes reconstruites <span class="chip c-new">Nouveau</span></h3><p>Eastbrook, Highwatch, Fenbridge et dix villes peintes : bâtiments aux <b>portes ouvertes qu’on traverse</b>, tavernes avec clients et ambiance, auberge du Mirefen refaite — et le <b>Hall des Lanternes</b>, la guilde des aventuriers de Highwatch.</p></div><div class="card"><h3>Le monde à l’échelle <span class="chip c-bal">Équilibrage</span></h3><p>Les mobs du monde ouvert montent avec le niveau : <b>×3,25 PV et ×1,35 dégâts au niveau 8</b>, plafonné au-delà (les instances gardent leur réglage propre). Chaque quête de niveau propose désormais un <b>choix d’armure</b>, des boucliers rejoignent les récompenses (Eastbrook, Mirefen, Thornpeak), et les élites et champions du monde sont plafonnés.</p></div><div class="card"><h3>Quêtes mondiales à l’Honor <span class="chip c-new">Nouveau</span></h3><p>Chaque jour, <b>deux créneaux</b> de la rotation paient <b>150 Honor</b> — les mêmes pour tout le royaume, tirés au reset. De quoi financer sa Guerre sans mettre les pieds en champ de bataille. Les quêtes en cours deviennent <b>remplaçables</b>, et une récompense qui déborde de tes sacs t’est <b>postée</b>.</p></div><div class="card"><h3>Le monde respire <span class="chip c-new">Interface</span></h3><p>La carte du monde devient redimensionnable et affiche les <b>ports de ferry avec horaires en direct</b> ; un nouvel exploit récompense le labyrinthe de haies en difficile ; ton fantôme se ramène au <b>dernier boss vaincu</b> ; une faille ou un Trésor enterré reprend à son portail après une déconnexion.</p></div></div></section><section id="guilde"><h2><span class="num">05</span>Guilde &amp; social</h2><p class="sec-sub">Un lieu emblématique, un outil de recrutement, et une modération équipée.</p><div class="grid cols-2"><div class="card"><h3>Le Hall des Lanternes <span class="chip c-new">Nouveau</span></h3><p>Highwatch se dote de la guilde des aventuriers, construite dans le style peint du monde : un lieu de repère pour trouver du monde — ou s’en vanter.</p></div><div class="card"><h3>Recrutement unifié <span class="chip c-new">Nouveau</span></h3><p>Recrutement de donjon et gestion d’expédition dans <b>une seule fenêtre</b>. Dans la même veine : un clic droit sur une ligne sociale ouvre le menu du joueur, et l’en-tête de groupe compte tout le monde, toi inclus.</p></div><div class="card"><h3>La modération s’organise <span class="chip c-util">Modération</span></h3><p>Un <b>mot du royaume</b> affiché dans le chat, les commandes GM <b>/visible</b>, <b>/watch</b> et <b>/announce</b>, et le corps du modérateur spectateur reste dans le monde. Les joueurs normaux ne verront que le résultat.</p></div></div></section><section id="confort"><h2><span class="num">06</span>Confort &amp; technique</h2><p class="sec-sub">Les montures changent de nature, un cadeau t’attend à la connexion, et l’abonnement Adhésion se met en place — sans être achetable tout de suite.</p><div class="grid cols-2"><div class="card more" data-detail="montures" tabindex="0" role="button"><h3>Montures cosmétiques et rangs <span class="chip c-new">Nouveau</span></h3><p>Les <b>rênes ne donnent plus que l’apparence</b> (révocable) ; la formation chez Marla possède la vitesse et l’accès. Change de peau en selle — Moonwing, Gloamveil — et la <b>Nightwing Chimaera</b> devient montable.</p><span class="more-link">Voir le détail</span></div><div class="card"><h3>Cadeaux de sortie <span class="chip c-util">Cadeau</span></h3><p>Chaque personnage existant reçoit <b>un redesign d’apparence</b> disponible et voit ses <b>verrouillages de donjons et raids remis à zéro</b> (normal et héroïque). Les boss du monde et les quêtes hebdomadaires sont préservés — repars de neuf sans rien perdre.</p></div><div class="card more" data-detail="adhesion" tabindex="0" role="button"><h3>L’Adhésion arrive <span class="chip c-new">Annonce</span></h3><p>L’infrastructure d’abonnement est en place : <b>30 jours</b>, <b>+20 % d’XP</b>, une tenue complète de sept pièces avec son bâton, et un courrier qui ouvre <b>toute la banque</b>. Les achats s’ouvriront après les contrôles de paiement — rien à faire maintenant.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="primes" tabindex="0" role="button"><h3>Le confort JcJ <span class="chip c-pvp">JcJ</span></h3><p>Un <b>tracker de cooldowns</b> offensifs et défensifs sur les plaques ennemies, les <b>primes mondiales</b> pour les séries de kills flagués, un crâne-trophée et de l’or sur le corps, le <b>Skull Bag</b> (500 Honor), et la Résurrection JcJ attend désormais <b>15 secondes</b>.</p><span class="more-link">Voir le détail</span></div><div class="card"><h3>Vue et réglages <span class="chip c-new">Option</span></h3><p>Une <b>caméra première personne</b> au zoom maximal (opt-in), le <b>Gearscore</b> sur la fiche et l’inspecteur, un choix de preset graphique au premier lancement, le <b>Raw Mouse Input</b>, la conversion de clavier (Turkish Q, portugais), et un slider d’ambience séparé.</p></div><div class="card"><h3>Compagnons <span class="chip c-new">Nouveau</span></h3><p>Les <b>ordres de familier</b> passent à la barre d’action avec une posture <b>Assist</b> ; le chasseur garde son familier dans les delves, le démoniste son démon. Et une paire de sprites-flammes, <b>Flicker et Glimmer</b>, rejoint les compagnons — avec la Nourrice-reward annuelle et parrainage.</p></div></div></section><div class="note"><b>Ce que ça change pour toi :</b> le jeu que tu connais a changé de visage — littéralement, pour les villes et les donjons. Ta première connexion vaut les trois cadeaux : un reset des verrouillages pour tout refaire, un redesign d’apparence si tu veux changer de tête, et — si tu main Amélioration ou farouche — un sac d’objets dont la stat primaire vient de basculer. Les builds de la guilde seront repris page BiS dès la reprise des données.</div></div><dialog id="modal" aria-labelledby="mTitle"><div class="modal-head"><h3 id="mTitle"></h3><button class="close" id="mClose" aria-label="Fermer">✕</button></div><div class="modal-body" id="mBody"></div></dialog><script>const DETAILS={
"groveheart":{"title":"Le Groveheart réinventé, pièce par pièce","summary":"La forme Sporemender devient la signature du soigneur, et toute la boîte à outils bouge.","body":"<h4>La forme Sporemender</h4><ul><li>Une forme <b>signature</b> pour le druide soigneur, avec son modèle animé dédié (visible dans le HUD, les icônes et le wiki du jeu).</li><li><b>Spore Burst</b> : un soin posé au sol avec une éclaboussure de dégâts les alliés proches — du heal de zone à déclencher où le groupe se tient.</li><li>Le soin continu (l’ex-Wildbloom, rebaptisée <b>Sporemending</b>) sème des spores lisibles, plus clairsemées si tu joues avec l’option mouvement réduit.</li></ul><h4>La boîte à outils</h4><ul><li><b>Typhoon</b> projette désormais en l’air — crédit de chute pour le tueur — sans infliger de peur, et sa trajectoire est bornée.</li><li><b>Slumber</b> gagne une résistance décroissante, <b>Bloodrift</b> double sa charge, et <b>Dash</b> part de n’importe quelle forme.</li><li>Le set de la v0.44.1 (Peau de Crin-sang à la Force, 2/4 pièces) reste la base.</li></ul>"},
"chasseur":{"title":"Le chasseur refondu, du sol au plafond","summary":"Mobilité totale, deux nouveaux sorts, un Fieldcraft réécrit — et la fin des portées minimales.","body":"<h4>La mobilité d’abord</h4><ul><li><b>Incantations en mouvement</b> et <b>zones instantanées</b> : le chasseur ne se fige plus pour poser son jeu.</li><li>Plus <b>aucune portée minimale</b> : la zone morte d’Auto Shot — 8 yards pendant des mois, 4 un moment — disparaît complètement. Tu tires au corps à corps si tu veux.</li></ul><h4>Les nouveaux jouets</h4><ul><li><b>Scatterbolt</b>, un carreau d’arbalète explosif, et <b>Play Dead</b> : le leurre ultime, peint et animé.</li><li><b>Fieldcraft</b> réécrit de fond en comble ; <b>Courser</b> et <b>Trailbreak</b> retaillés ; des <b>pièges cachés</b> rejoignent l’arsenal.</li><li><b>Efficient Rhythm</b> et <b>Fang Chorus</b> montrent leur progression sur la barre de buffs.</li></ul>"},
"force":{"title":"Force, Agilité, Intelligence : qui veut quoi","summary":"Une table unique décide de la stat primaire de chaque spécialisation — et deux specs changent de camp.","body":"<h4>La table</h4><ul><li><b>Force</b> : guerrier (3 specs), paladin (Protection, Retribution), chaman <b>Amélioration</b>, druide <b>farouche</b>.</li><li><b>Agilité</b> : rogue (3 specs), chasseur (3 specs).</li><li><b>Intelligence</b> : tous les lanceurs et tous les soigneurs.</li></ul><h4>Ce que ça veut dire</h4><ul><li>La mêlée guerrier/paladin/chaman/druid gagne <b>2 de puissance d’attaque par point de Force</b> et ne lit plus l’Agilité du tout.</li><li>Un <b>félin</b> ne gagne <b>rien</b> de l’Agilité (zéro puissance), un <b>ours</b> 1,5 par point. Le rogue, lui, additionne Force + Agilité, et l’Agilité ajoute du critique.</li><li>Les objets Amélioration et farouche tombent désormais avec de la Force — la Peau de Crin-sang l’avait annoncé dès la v0.44.1, tout le butin suit.</li><li>En pratique : si tu main une de ces deux specs, ton sac vient d’être requalifié — les builds de la page BiS seront recalculés sur les nouvelles données.</li></ul>"},
"donjons":{"title":"Cinq donjons, reconstruits en plein air","summary":"Des décors ouverts bâtis à la main, des entrées dans le monde, et un guide de boss intégré.","body":"<h4>Les chantiers</h4><ul><li><b>Hollow Crypt</b>, <b>Sunken Bastion</b>, <b>Drowned Temple</b>, <b>Wildheart Basin</b> et <b>Gravewyrm Sanctum</b> : refaits sur des terrains ouverts scénographiés — plus de couloirs génériques.</li><li>Le <b>Mere Hydra</b> compte désormais comme boss du Drowned Temple ; les rencontres de Selthe et Zulgar sont rejouées avec les retours des testeurs.</li><li>Les <b>entrées sont bâties dans le monde</b> : la mâchoire de jaguar du Wildheart, le portail du Bastion débarrassé de son rayon, la Chaîne du Sceau refaite.</li></ul><h4>L’équipement du donjonneur</h4><ul><li>Un <b>guide de boss intégré</b> pour chaque donjon à cinq, un <b>tracker d’objectifs</b> avec le nom du donjon et une ligne par boss, et des alertes mécaniques désactivables en option.</li><li>En héroïque : bandes de vie dédiées et des <b>miniboss normaux</b> placés sous leurs boss ; le Hollow Crypt gagne un tuning dédié et une salle de boss <b>scellée 10 secondes</b>.</li><li>Ton <b>fantôme se ramène au dernier boss vaincu</b> ; les mobs perdent la ligne de vue et contournent les murs.</li></ul>"},
"marques":{"title":"Les marques héroïques deviennent une monnaie","summary":"Fini l’objet de sac qui débordait : un solde en bourse, qui paie mieux et se dépense.","body":"<h4>Ce qui change</h4><ul><li>Les <b>Heroic Marks</b> ne sont plus un objet de sac mais une <b>monnaie</b> : plus d’empilement perdu au débordement, un solde visible et dépensable.</li><li>Un final héroïque paie mieux : <b>10 po</b> nominal en donjon à cinq (tirage 6–14), <b>20 po</b> en raid (tirage 12–28).</li><li>Les anciens stockages, courriers et réclamations en attente restent lisibles : l’identifiant de la monnaie reprend l’ancien objet.</li></ul><h4>Et le verrou antifarm</h4><ul><li>Les verrouillages quotidiens par donjon ne bougent pas : l’or héroïque récompense la clear légitime, le mode normal reste la ligne anti-farm.</li></ul>"},
"primes":{"title":"Primes mondiales, collines et Résurrection","summary":"Le JcJ mondial reprend tout le système de primes — et le condamné peut se relever, 15 secondes après.","body":"<h4>Les primes, version monde</h4><ul><li>Cinq kills payés <b>d’affilée</b>, sans mourir, drapeau levé : tu portes une <b>prime sur la tête</b> — chacun peut porter la sienne.</li><li>Pendant ce temps, TES kills paient plus (150 %, 100 %, 50 % de l’Honor sur les répétitions d’une même victime) et celui qui t’abat partage un <b>pool d’Honor doublé</b>.</li><li>Toute mort — ou drapeau baissé — efface la prime et la série. Le camping ne paie toujours rien : le quatrième kill d’une même victime dans la fenêtre ne rapporte rien.</li></ul><h4>Les collines</h4><ul><li>La capture passe à <b>30 secondes</b> qu’un rival met seulement en <b>pause</b> — plus de capture annulée d’un pas.</li><li>L’Honor de détention passe à un <b>taux fixe de 9 par minute payée</b> — environ 390 pour une tenue complète sans contestation.</li></ul><h4>Mourir en JcJ mondial</h4><ul><li>La <b>Résurrection JcJ</b> s’honore après <b>15 secondes</b> : l’écran de mort décompte et nomme le cimetière — le tueur ne se fait pas recevoir par un ennemi frais plein vie.</li><li>Le corps lâche de l’or et un <b>crâne-trophée</b> empilable ; le <b>Skull Bag</b> (500 Honor) les range sans manger de place.</li><li><b>Quitter le monde</b> en plein combat mondial vaut forfait.</li></ul>"},
"montures":{"title":"Montures : l’apparence se sépare de la vitesse","summary":"Les rênes deviennent un costume révocable ; la formation reste le vrai passeport.","body":"<h4>Le nouveau modèle</h4><ul><li>Les <b>rênes</b> ne donnent plus que l’<b>apparence</b> de la monture — révocable : perdre ses rênes ne retire jamais la formation.</li><li>La <b>formation</b> (chez Marla) possède la vitesse et l’accès : <b>80 po</b> le rang de base, <b>1 000 po</b> le rang avancé.</li><li>L’invocation reste un canal d’1,5 s, interrompue en combat ou dans l’eau ; le démontage reste instantané.</li></ul><h4>Et les nouveautés</h4><ul><li>Change de <b>peau en selle</b> : le Moonwing et le Gloamveil s’enfilent comme des tenues de monture.</li><li>La <b>Nightwing Chimaera</b> devient montable, et le Drakemaw Raptor repasse par la case animation (refait dans Blender).</li><li>La Valestrider, elle, se paie désormais en <b>500 marques Rift Watch</b> (elle coûtait 100 po).</li></ul>"},
"adhesion":{"title":"L’Adhésion : ce qui est posé, ce qui ne l’est pas","summary":"L’infrastructure d’abonnement est là, les achats ne sont pas encore ouverts — rien à faire maintenant.","body":"<h4>Ce que l’abonnement promet</h4><ul><li><b>30 jours</b> par souscription, <b>+20 % d’XP</b> pendant toute la durée.</li><li>Une <b>tenue complète</b> de sept pièces (casque aux bottes) et son bâton.</li><li>Un <b>courrier de banque</b> qui ouvre TOUTE la banque : la Chambre forte des matériaux et les coffres de tes autres personnages.</li></ul><h4>Ce qui n’est pas encore ouvert</h4><ul><li>Les <b>achats</b> restent fermés le temps des contrôles d’acceptation de paiement : l’infrastructure est en place, la boutique pas encore.</li><li>Rien ne change pour toi tant que tu n’achètes rien — le jeu reste le même.</li></ul>"},
};const modal=document.getElementById('modal'),mTitle=document.getElementById('mTitle'),mBody=document.getElementById('mBody');let lastFocus=null;function openModal(k){const x=DETAILS[k];if(!x)return;lastFocus=document.activeElement;mTitle.textContent=x.title;mBody.innerHTML=(x.summary?'<p class="summary">'+x.summary+'</p>':'')+x.body;if(window.CodexPopup)CodexPopup.enhance(mBody);if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}function closeModal(){if(typeof modal.close==='function')modal.close();else modal.removeAttribute('open');if(lastFocus)lastFocus.focus();}document.querySelectorAll('[data-detail]').forEach(e=>{e.addEventListener('click',()=>openModal(e.dataset.detail));e.addEventListener('keydown',x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();openModal(e.dataset.detail);}})});document.getElementById('mClose').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});modal.addEventListener('cancel',()=>{if(lastFocus)lastFocus.focus();});</script><script src="../assets/codex-popup.js" defer></script><script src="../assets/nav.js"></script><script src="../assets/lang.js"></script><script src="../assets/version.js" data-version="v0.45.0" defer></script></body></html>
