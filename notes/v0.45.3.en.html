<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>What's new in v0.45.3 — La Clauderie</title><meta name="description" content="Gourdlight Eve: Halloween trick-or-treating in Eastbrook, Fenbridge and Highwatch, the Emberbristle Broom to earn, and Old Thatchgrin to challenge until November 1st. The Shadow priest gains Vampiric Touch, Void Rupture and the Tithe Bomb. King of the Hill is rescheduled."><meta name="theme-color" content="#c8a04b"><meta property="og:type" content="website"><meta property="og:site_name" content="La Clauderie"><meta property="og:title" content="What's new in v0.45.3 — La Clauderie"><meta property="og:url" content="https://laclauderie.fr/notes/v0.45.3.en.html"><link rel="canonical" href="https://laclauderie.fr/notes/v0.45.3.en.html"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icon-180.png"><script src="../assets/pwa.js" defer></script><script>if(localStorage.getItem('lang')!=='en')location.replace('v0.45.3.html'+location.hash);</script><style>
  :root {

  .digest ol { list-style: none; margin: 0; padding: 0; background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; overflow: hidden; }

  /* Sens du changement, d'un coup d'œil : amélioration, nerf, inchangé. */

  .more-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; color: var(--gold-bright); font-size: 0.82rem; font-weight: 600; }

  /* Chips */
  .chip { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; font-weight: 600; white-space: nowrap; }
  .c-new { color: var(--heal); } .c-raid { color: var(--gold); } .c-pvp { color: var(--dps); }
  .c-bal { color: var(--q-legendary); } .c-mob { color: var(--arcane); } .c-epic { color: var(--q-epic); }
  .c-plate { color: var(--dps); } .c-leather { color: var(--heal); } .c-cloth { color: var(--arcane); } .c-util { color: var(--q-rare); }

  .statline { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim); }
  .statline b { color: var(--text); }
  .grp-title { font-family: var(--font-display); font-size: 1rem; color: var(--dim); margin: 22px 0 12px; }
  .compact { columns: 2; column-gap: 34px; }

  /* Modal */

  .kbd { font-family: var(--font-mono); background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 0.85em; color: var(--text); }

  .note { margin-top: 8px; background: color-mix(in srgb, var(--gold) 8%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 11px; padding: 16px 19px; color: var(--dim); font-size: 0.94rem; }

<body><div class="topbar"><div class="row"><a href="../index.html" class="brand"><span class="sigil">C</span><b>La Clauderie</b></a><nav class="topnav" data-guild-nav data-current="news" aria-label="Site navigation"></nav></div></div><div class="wrap"><header class="hero"><p class="eyebrow">World of ClaudeCraft · Release notes</p><h1>What's new in <span class="v">v0.45.3</span></h1><p class="lede"><strong class="hl">Gourdlight Eve</strong>, the autumn event: trick-or-treating across three towns, a flying broom to earn and Old Thatchgrin to bring down every day — until <strong class="hl">November 1st, 12:00 UTC</strong>. The <strong class="hl">Shadow priest</strong> gets its update, and Warfare reshuffles the hills.</p><div class="meta"><span><b>Released</b> October 27, 2026</span><span><b>Since</b> v0.45.2</span><span><b>Event + class</b></span></div><div class="hint">💡 Click a card for the details.</div></header><nav class="digest" aria-labelledby="digest-title"><h2 id="digest-title">At a glance</h2><p class="sec-sub">The same sections at every release, in the same order.</p><ol><li class=""><span class="d-ico">⚔️</span><a class="d-name" href="#classes">Classes &amp; spells</a><span class="d-say"><b class="up">Shadow priest ↑</b> Vampiric Touch, Void Rupture, the Tithe Bomb and a Gloomtithe medallion.</span></li><li class="none"><span class="d-ico">🔨</span><a class="d-name" href="#metiers">Professions &amp; gathering</a><span class="d-say">—</span></li><li class=""><span class="d-ico">🐉</span><a class="d-name" href="#donjons">Dungeons, rifts &amp; bosses</a><span class="d-say">Boss loot is credited once; loot rolls settle before switching difficulty.</span></li><li class=""><span class="d-ico">🗺️</span><a class="d-name" href="#monde">World &amp; quests</a><span class="d-say"><b class="up">Gourdlight Eve ↑</b> trick-or-treating, haunted pumpkins and the daily Thatchgrin.</span></li><li class=""><span class="d-ico">🏰</span><a class="d-name" href="#guilde">Guild &amp; social</a><span class="d-say"><b class="up">Hills ↑</b> back to the 2h/30min rhythm; world and hill bounties stack.</span></li><li class=""><span class="d-ico">⚙️</span><a class="d-name" href="#confort">Comfort &amp; tech</a><span class="d-say">The Low preset lights the day and the dark zones far better.</span></li></ol></nav><section id="classes"><h2><span class="num">01</span>Classes &amp; spells: the Shadow priest stirs the cauldron</h2><p class="sec-sub">Three new spells and a resource to manage: the Shadow kit has its gem engine.</p><div class="grid cols-2"><div class="card more" data-detail="shadow" tabindex="0" role="button"><h3>Vampiric Touch, Void Rupture, Tithe Bomb <span class="chip c-new">New</span></h3><p>A <b>DoT</b> that shares the healing, an <b>instant rupture</b> that eats 3 charges, and an <b>AoE bomb</b> prepped with 20 generated Gloomtithe — all watched on a movable medallion.</p><span class="more-link">See details</span></div><div class="card"><h3>The Gloomtithe medallion <span class="chip c-new">Interface</span></h3><p>A <b>movable, scalable</b> medallion shows your five Gloomtithe gems and the Tithe Bomb progress separately — no more guessing what is ready.</p></div></div></section><section id="metiers"><h2><span class="num">02</span>Professions &amp; gathering</h2><p class="sec-sub">Nothing new on the profession side — but the event stocks a candy shelf.</p><div class="grid cols-3"><div class="card"><h3>Hester's candies <span class="chip c-util">Event</span></h3><p>Five Gourdlight Eve sweets are <b>ordinary Well Fed food</b> (a mirror of cooking's entry rung): comfort, never a permanent edge.</p></div></div></section><section id="donjons"><h2><span class="num">03</span>Dungeons, rifts &amp; bosses</h2><p class="sec-sub">Rewards that settle cleanly, and a chest that no longer pays twice.</p><div class="grid cols-2"><div class="card"><h3>Loot rolls settle <span class="chip c-util">Fix</span></h3><p>Completed <b>boss loot rolls</b> now settle correctly, so a party can <b>change difficulty</b> without leaving a reward hanging.</p></div><div class="card"><h3>One death, one payout <span class="chip c-util">Fix</span></h3><p>A boss's death awards <b>loot, kill credit and buddy rolls only once</b> — chained death effects included. And the replenishable Skerrit's Shardpike quest item can no longer yield salvage or disenchant materials.</p></div></div></section><section id="monde"><h2><span class="num">04</span>World &amp; quests: Gourdlight Eve</h2><p class="sec-sub">The autumn event moves into three towns, until November 1st at 12:00 UTC.</p><div class="grid cols-2"><div class="card more" data-detail="gourdlight" tabindex="0" role="button"><h3>Trick-or-treating and pumpkins <span class="chip c-new">Event</span></h3><p><b>Trick-or-treat</b> through Eastbrook, Fenbridge and Highwatch, <b>rotating dailies</b> from Hester Gourdwick, <b>Haunted Pumpkins</b> to hunt down — and the scarecrow <b>Old Thatchgrin</b> rising again every day.</p><span class="more-link">See details</span></div><div class="card more" data-detail="broom" tabindex="0" role="button"><h3>The Emberbristle Broom <span class="chip c-new">Mount</span></h3><p>The headliner: a <b>flying broom</b> that stays yours all year. Five Emberwoven Sheaves at Hester's — one per day of Thatchgrin — or a 3% chance he drops it outright.</p><span class="more-link">See details</span></div><div class="card"><h3>What stays, what clears <span class="chip c-util">Rules</span></h3><p>Everything you earn (broom, toys, cosmetics, deeds, titles) remains <b>after the event</b>; unfinished event quests and temporary quest supplies clear when the event closes or on your next login.</p></div><div class="card"><h3>Markers on the horizon <span class="chip c-new">Interface</span></h3><p><b>Quest markers</b> stay visible on distant NPCs, while names and roles remain close-range only.</p></div></div></section><section id="guilde"><h2><span class="num">05</span>Guild &amp; social: the hills reshuffle</h2><p class="sec-sub">The old rhythm returns, and the two bounties finally stack.</p><div class="grid cols-2"><div class="card"><h3>Back to 2h / 30min <span class="chip c-util">Tuning</span></h3><p>King of the Hill resumes its rhythm: <b>a hill every 2 hours, standing 30 minutes</b> — capture stays 30 seconds that a rival only pauses.</p></div><div class="card"><h3>The bounties stack <span class="chip c-pvp">PvP</span></h3><p><b>World bounties</b> (your flagged kill streak) and <b>hill bounties</b> (the price on your head) now <b>stack</b>: carry both and your killer is paid twice. And logging out after recent world PvP leaves your body in the world for the combat hold — another character cannot clear it; only the same character can reconnect onto it.</p></div></div></section><section id="confort"><h2><span class="num">06</span>Comfort &amp; tech</h2><p class="sec-sub">The Low preset gets a fresh coat, and the translations follow.</p><div class="grid cols-2"><div class="card"><h3>The Low preset lights up <span class="chip c-new">Graphics</span></h3><p>Better daytime lighting, <b>more legible dark zones and raids</b>, clearer paths, softer shorelines and better water: Low is a real choice again, not a punishment.</p></div><div class="card"><h3>Translations <span class="chip c-util">Locales</span></h3><p>The release's texts (Gourdlight Eve and Membership included) are complete in every locale, with the generated localization and guide content refreshed.</p></div></div></section><div class="note"><b>What it means for you:</b> the event closes November 1st at 12:00 UTC — the broom asks five sheaves, one per daily Thatchgrin, and unspent sheaves carry over to the next event. Shadow priests: your rotation changes; the DPS page will be recomputed with the new numbers once the simulation passes.</div></div><dialog id="modal" aria-labelledby="mTitle"><div class="modal-head"><h3 id="mTitle"></h3><button class="close" id="mClose" aria-label="Fermer">✕</button></div><div class="modal-body" id="mBody"></div></dialog><script>const DETAILS={
"gourdlight":{"title":"Gourdlight Eve, the rundown","summary":"Trick-or-treating in three towns, rotating dailies, and a scarecrow to bring down daily.","body":"<h4>The circuit</h4><ul><li><b>Trick-or-treat</b>: knock on doors in Eastbrook, Fenbridge and Highwatch — the townsfolk answer with a treat or a trick.</li><li><b>Hester Gourdwick</b> offers rotating daily quests, and <b>Haunted Pumpkins</b> hide in the decor to hunt down.</li><li><b>Old Thatchgrin</b>, the giant scarecrow, rises again every day: a real daily boss, with his daily lockout.</li></ul><h4>Currency and toys</h4><ul><li>The harvested <b>Wrapped Sweet</b> stacks deep; the event's small shop sells toys, cosmetics and deeds.</li><li>The <b>costume draughts</b> dress you as a skeleton, a ghost or a bat for 10 minutes — pure looks, refused in combat.</li><li>The shelf's five <b>candies</b> are ordinary food (a mirror of cooking's entry rung): never better than what a cook makes.</li></ul><h4>When it ends</h4><ul><li>The event closes <b>November 1st at 12:00 UTC</b>.</li><li>Earned, kept: the broom, toys, cosmetics, deeds and titles stay yours after the event.</li><li>Unfinished event quests and temporary supplies clear at closure or on your next login.</li></ul>"},
"broom":{"title":"The Emberbristle Broom, how it works","summary":"Five days of Thatchgrin at Hester's — or a 3% chance he drops it outright.","body":"<h4>The two roads</h4><ul><li><b>The slow road</b>: Old Thatchgrin pays one <b>Emberwoven Sheaf</b> per day (daily lockout, never to a character who already keeps the broom). Five Sheaves open the purchase at Hester's.</li><li><b>The fast road</b>: each daily Thatchgrin kill has a <b>3%</b> chance to drop the reins outright.</li><li>Unspent Sheaves <b>carry over</b> to the next event.</li></ul><h4>The broom itself</h4><ul><li>A broom that <b>hovers</b> — a permanent mount look, usable all year round.</li><li>Like every mount since v0.45.0, speed comes from your <b>riding rank</b>, not from the broom.</li></ul>"},
"shadow":{"title":"The Shadow priest, a gem engine","summary":"Vampiric Touch, Void Rupture and the Tithe Bomb around a five-gem resource.","body":"<h4>The resource</h4><ul><li><b>Gloomtithe</b>: five charges at most, shown on a movable, scalable medallion.</li><li><b>Vampiric Touch</b>: a 15s DoT (a tick every 3s) whose ticks share 20% of the enemy's lost health as healing around you. With at least 2 charges, it consumes them to hit <b>30% harder</b>.</li></ul><h4>The spenders</h4><ul><li><b>Void Rupture</b>: eats 3 charges for an <b>instant rupture</b> — the kit's mobility hit, weaker than Touch per gem but immediate.</li><li><b>Tithe Bomb</b>: prep a bomb with <b>20 generated Gloomtithe</b> (generation counts even at full gems), then detonate it on a target: <b>AoE damage within 8 yards</b>, reduced past 5 targets.</li><li>Bomb progress <b>persists between fights</b> (up to one prepped bomb); dying clears it, and a raid boss encounter resets it at the start.</li></ul>"},
};const modal=document.getElementById('modal'),mTitle=document.getElementById('mTitle'),mBody=document.getElementById('mBody');let lastFocus=null;function openModal(k){const x=DETAILS[k];if(!x)return;lastFocus=document.activeElement;mTitle.textContent=x.title;mBody.innerHTML=(x.summary?'<p class="summary">'+x.summary+'</p>':'')+x.body;if(window.CodexPopup)CodexPopup.enhance(mBody);if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}function closeModal(){if(typeof modal.close==='function')modal.close();else modal.removeAttribute('open');if(lastFocus)lastFocus.focus();}document.querySelectorAll('[data-detail]').forEach(e=>{e.addEventListener('click',()=>openModal(e.dataset.detail));e.addEventListener('keydown',x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();openModal(e.dataset.detail);}})});document.getElementById('mClose').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});modal.addEventListener('cancel',()=>{if(lastFocus)lastFocus.focus();});</script><script src="../assets/codex-popup.js" defer></script><script src="../assets/nav.js"></script><script src="../assets/lang.js"></script><script src="../assets/version.js" data-version="v0.45.3" defer></script></body></html>
