<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Nouveautés v0.45.5 — La Clauderie</title><meta name="description" content="La v0.45.5 répare le paiement de l’Adhésion et livre jeton et rênes en fenêtre de butin ; les PV des monstres montent en pente douce jusqu’au triple au niveau 20."><meta name="theme-color" content="#c8a04b"><meta property="og:type" content="website"><meta property="og:site_name" content="La Clauderie"><meta property="og:title" content="Nouveautés v0.45.5 — La Clauderie"><meta property="og:url" content="https://laclauderie.fr/notes/v0.45.5.html"><link rel="canonical" href="https://laclauderie.fr/notes/v0.45.5.html"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icon-180.png"><script src="../assets/pwa.js" defer></script><script>if(localStorage.getItem('lang')==='en')location.replace('v0.45.5.en.html'+location.hash);</script><style>
  :root {
    --bg: #0b0d12; --bg-card: #161a24; --bg-card-hover: #1a1f2b; --bg-modal: #12161f;
    --line: #262c3a; --line-soft: #1e2431;
    --gold: #c8a04b; --gold-bright: #e6c37a;
    --text: #dfe3ea; --dim: #8b93a3; --faint: #5b6272;
    --q-rare: #2f8bff; --q-epic: #a335ee; --q-legendary: #ff8000;
    --dps: #e5544a; --heal: #58c46a; --arcane: #58b6c9; --discord: #5865f2;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    line-height: 1.55; -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 900px 460px at 15% -8%, rgba(200,160,75,0.09), transparent 70%),
      radial-gradient(ellipse 760px 400px at 88% -4%, rgba(47,139,255,0.06), transparent 70%);
  }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 28px); }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-soft); }
  .topbar .row { max-width: 960px; margin: 0 auto; padding: 8px clamp(16px,4vw,28px); display: flex; align-items: center; gap: 14px; min-height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .sigil { width: 26px; height: 30px; flex: none; background: linear-gradient(160deg, var(--gold-bright), var(--gold) 55%, #8a6d2e); clip-path: polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%); display: grid; place-items: center; color: #1a130a; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; }
  .brand b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .topnav { margin-left: auto; display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; font-size: 0.88rem; }
  .topnav a { color: var(--dim); text-decoration: none; }
  .topnav a:hover { color: var(--gold-bright); }
  .topnav .cur { color: var(--gold-bright); font-weight: 600; }
  @media (max-width: 620px) { .brand b { display: none; } .topnav { gap: 4px 11px; font-size: 0.82rem; } }

  /* Hero */
  .hero { padding: clamp(40px, 7vw, 72px) 0 clamp(24px, 4vw, 40px); border-bottom: 1px solid var(--line-soft); }
  .eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.4rem, 7vw, 3.8rem); line-height: 1; margin: 0 0 12px; }
  h1 .v { color: var(--gold-bright); }
  .lede { color: var(--dim); font-size: clamp(1rem, 2.2vw, 1.2rem); max-width: 58ch; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--faint); }
  .meta b { color: var(--dim); }
  .hint { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; background: color-mix(in srgb, var(--gold) 10%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); color: var(--gold-bright); padding: 8px 14px; border-radius: 8px; font-size: 0.86rem; }

  /* Sections */
  section { padding: clamp(26px, 4vw, 40px) 0; border-top: 1px solid var(--line-soft); scroll-margin-top: 72px; }
  section:first-of-type { border-top: none; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .sec-num { font-family: var(--font-mono); color: var(--gold); font-size: 0.82rem; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 3.6vw, 2.1rem); margin: 0; }
  .sec-sub { color: var(--dim); margin: -8px 0 20px; max-width: 66ch; }

  .grid { display: grid; gap: 13px; }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .cols-3 { grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); }

  .card { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; padding: 19px; }
  .card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.14rem; margin: 0 0 6px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .card p { margin: 6px 0 0; color: var(--dim); font-size: 0.93rem; }
  .card ul { margin: 10px 0 0; padding-left: 1.05em; color: var(--dim); font-size: 0.9rem; }
  .card ul li { margin: 4px 0; }
  .card ul li::marker { color: var(--gold); }

  /* Bandeau « En un coup d'œil » — mêmes rubriques, même ordre, à chaque
     version : le lecteur prend l'habitude et trouve sa classe sans lire. */
  .digest { padding: clamp(24px, 3.5vw, 34px) 0 clamp(2px, 1vw, 8px); }
  .digest h2 { font-size: clamp(1.2rem, 2.8vw, 1.5rem); margin: 0 0 6px; }
  .digest .sec-sub { margin: 0 0 16px; }
  .digest ol { list-style: none; margin: 0; padding: 0; background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; overflow: hidden; }
  .digest li { display: grid; grid-template-columns: 30px 215px 1fr; align-items: baseline; gap: 3px 12px; padding: 13px 17px; border-top: 1px solid var(--line-soft); }
  .digest li:first-child { border-top: none; }
  .d-ico { font-size: 0.98rem; }
  .d-name { font-weight: 600; color: var(--text); text-decoration: none; }
  a.d-name:hover, a.d-name:focus-visible { color: var(--gold-bright); }
  .d-say { color: var(--dim); font-size: 0.92rem; }
  .digest li.none .d-name, .digest li.none .d-say { color: var(--faint); font-weight: 400; }
  /* Sens du changement, d'un coup d'œil : amélioration, nerf, inchangé. */
  .up { color: var(--heal); font-weight: 600; white-space: nowrap; }
  .down { color: var(--dps); font-weight: 600; white-space: nowrap; }
  .eq { color: var(--dim); font-weight: 600; white-space: nowrap; }
  @media (max-width: 620px) {
    .digest li { grid-template-columns: 26px 1fr; padding: 12px 15px; }
    .d-say { grid-column: 2; }
  }

  /* Clickable cards */
  .card.more { cursor: pointer; transition: border-color .15s, transform .15s, background .15s; position: relative; }
  .card.more:hover { border-color: var(--gold); transform: translateY(-2px); background: var(--bg-card-hover); }
  .card.more:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .more-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; color: var(--gold-bright); font-size: 0.82rem; font-weight: 600; }
  .more-link::after { content: "→"; transition: transform .15s; }
  .card.more:hover .more-link::after { transform: translateX(3px); }

  /* Chips */
  .chip { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; font-weight: 600; white-space: nowrap; }
  .c-new { color: var(--heal); } .c-raid { color: var(--gold); } .c-pvp { color: var(--dps); }
  .c-bal { color: var(--q-legendary); } .c-mob { color: var(--arcane); } .c-epic { color: var(--q-epic); }
  .c-plate { color: var(--dps); } .c-leather { color: var(--heal); } .c-cloth { color: var(--arcane); } .c-util { color: var(--q-rare); }

  .statline { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim); }
  .statline b { color: var(--text); }
  .grp-title { font-family: var(--font-display); font-size: 1rem; color: var(--dim); margin: 22px 0 12px; }
  .compact { columns: 2; column-gap: 34px; }
  .compact li { margin: 5px 0; }
  @media (max-width: 560px) { .compact { columns: 1; } }
  strong.hl { color: var(--text); font-weight: 600; }

  /* Modal */
  dialog { padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-modal); color: var(--text); max-width: 640px; width: calc(100% - 28px); max-height: 86vh; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  dialog::backdrop { background: rgba(4,6,10,0.72); backdrop-filter: blur(3px); }
  .modal-head { position: sticky; top: 0; background: linear-gradient(180deg, var(--bg-modal), color-mix(in srgb, var(--bg-modal) 88%, transparent)); border-bottom: 1px solid var(--line-soft); padding: 18px 22px; display: flex; align-items: flex-start; gap: 14px; }
  .modal-head h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; margin: 0; line-height: 1.15; }
  .modal-head .close { margin-left: auto; flex: none; background: var(--bg-card); border: 1px solid var(--line); color: var(--dim); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .modal-head .close:hover { color: var(--text); border-color: var(--gold); }
  .modal-body { padding: 20px 22px 26px; overflow-y: auto; }
  .modal-body .summary { color: var(--dim); font-style: italic; margin: 0 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
  .modal-body h4 { font-family: var(--font); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-bright); margin: 22px 0 8px; }
  .modal-body h4:first-of-type { margin-top: 0; }
  .modal-body p { margin: 0 0 10px; font-size: 0.94rem; color: var(--text); }
  .modal-body ul { margin: 0 0 10px; padding-left: 1.15em; }
  .modal-body li { margin: 6px 0; font-size: 0.93rem; }
  .modal-body li::marker { color: var(--gold); }
  .modal-body b { color: var(--gold-bright); font-weight: 600; }
  .kbd { font-family: var(--font-mono); background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 0.85em; color: var(--text); }

  .note { margin-top: 8px; background: color-mix(in srgb, var(--gold) 8%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 11px; padding: 16px 19px; color: var(--dim); font-size: 0.94rem; }
  .note b { color: var(--gold-bright); }

  footer { border-top: 1px solid var(--line-soft); padding: 28px 0 54px; color: var(--faint); font-size: 0.82rem; text-align: center; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--gold-bright); }

<body><div class="topbar"><div class="row"><a href="../index.html" class="brand"><span class="sigil">C</span><b>La Clauderie</b></a><nav class="topnav" data-guild-nav data-current="news" aria-label="Navigation du site"></nav></div></div><div class="wrap"><header class="hero"><p class="eyebrow">World of ClaudeCraft · Notes de version</p><h1>Nouveautés <span class="v">v0.45.5</span></h1><p class="lede">Un correctif en deux volets : l’<strong class="hl">Adhésion se paie à nouveau</strong> et tes achats arrivent <strong class="hl">en fenêtre de butin</strong> — et la montée des <strong class="hl">PV des monstres se fait en pente douce</strong> : le triple de santé n’arrive plus dès le niveau 8, il attend le niveau 20.</p><div class="meta"><span><b>Publiée</b> le 1er novembre 2026</span><span><b>Depuis</b> v0.45.4</span><span><b>Adhésion + PV des mobs</b></span></div><div class="hint">💡 Clique sur une carte pour le détail.</div></header><nav class="digest" aria-labelledby="digest-title"><h2 id="digest-title">En un coup d’œil</h2><p class="sec-sub">Les mêmes rubriques à chaque version, dans le même ordre.</p><ol><li class="none"><span class="d-ico">⚔️</span><a class="d-name" href="#classes">Classes &amp; sorts</a><span class="d-say">—</span></li><li class="none"><span class="d-ico">🔨</span><a class="d-name" href="#metiers">Métiers &amp; récolte</a><span class="d-say">—</span></li><li class="none"><span class="d-ico">🐉</span><a class="d-name" href="#donjons">Donjons, failles &amp; boss</a><span class="d-say">—</span></li><li class=""><span class="d-ico">🗺️</span><a class="d-name" href="#monde">Monde &amp; quêtes</a><span class="d-say"><b class="up">PV des mobs ↓</b> pente douce jusqu’à ×3,25 au niveau 20 ; plancher de santé pour les élites.</span></li><li class="none"><span class="d-ico">🏰</span><a class="d-name" href="#guilde">Guilde &amp; social</a><span class="d-say">—</span></li><li class=""><span class="d-ico">⚙️</span><a class="d-name" href="#confort">Confort &amp; technique</a><span class="d-say"><b class="up">Adhésion ↑</b> checkout réparé, achats livrés en fenêtre de butin, même sacs pleins.</span></li></ol></nav><section id="classes"><h2><span class="num">01</span>Classes &amp; sorts</h2><p class="sec-sub">Aucun sort, talent ni formule de combat ne change.</p><div class="grid cols-2"><div class="card"><h3>Aucun changement <span class="chip c-bal">Égalité</span></h3><p>Le jeu est exactement celui de la v0.45.4 — la page DPS garde ses chiffres.</p></div></div></section><section id="metiers"><h2><span class="num">02</span>Métiers &amp; récolte</h2><p class="sec-sub">Rien de neuf côté métiers.</p><div class="grid cols-3"><div class="card"><h3>Aucun changement <span class="chip c-bal">Égalité</span></h3><p>Qualité de butin, Chambre forte et chef-d’œuvre suivent la v0.45.0.</p></div></div></section><section id="donjons"><h2><span class="num">03</span>Donjons, failles &amp; boss</h2><p class="sec-sub">Rien ne change en instance — ni butin, ni rencontres.</p><div class="grid cols-3"><div class="card"><h3>Aucun changement <span class="chip c-bal">Égalité</span></h3><p>Failles du sud, Quiver et marques héroïques suivent la v0.45.4 ; la lisse des PV ne touche que le monde ouvert.</p></div></div></section><section id="monde"><h2><span class="num">04</span>Monde &amp; quêtes</h2><p class="sec-sub">Le vrai changement de gameplay de la version : les monstres du monde reprennent une montée en santé raisonnable.</p><div class="grid cols-2"><div class="card more" data-detail="pvmobs" tabindex="0" role="button"><h3>Des PV qui montent en pente douce <span class="chip c-bal">Ajustement</span></h3><p>Les PV du monde ouvert <b>restent à l’échelle écrite jusqu’au niveau 5</b>, puis grimpent <b>+0,15 par niveau</b> pour atteindre <b>×3,25 au niveau 20</b> — au lieu du triple dès le niveau 8. Les dégâts des mobs ne bougent pas.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="elites" tabindex="0" role="button"><h3>Un plancher de santé pour les élites <span class="chip c-mob">Élites</span></h3><p>Les <b>élites faibles</b> ne tombent plus sous l’équivalent d’un monstre normal mis à l’échelle — les élites nommées gardent leur santé écrite, dégâts et armure d’élite inchangés.</p><span class="more-link">Voir le détail</span></div></div></section><section id="guilde"><h2><span class="num">05</span>Guilde &amp; social</h2><p class="sec-sub">Rien ne change côté guilde.</p><div class="grid cols-3"><div class="card"><h3>Aucun changement <span class="chip c-bal">Égalité</span></h3><p>Collines 2 h/30 min, primes cumulées et Guerre suivent la v0.45.3.</p></div></div></section><section id="confort"><h2><span class="num">06</span>Confort &amp; technique</h2><p class="sec-sub">Le chantier de la version : l’Adhésion se paie à nouveau, et les achats arrivent comme du butin.</p><div class="grid cols-2"><div class="card more" data-detail="adhesion" tabindex="0" role="button"><h3>Adhésion : le checkout reparle <span class="chip c-util">Correctif</span></h3><p>Le <b>checkout Stripe embarqué</b> refonctionne, l’offre de surclassement <b>mensuel→annuel</b> survit à un paiement abandonné, et le statut se <b>rafraîchit</b> tant que la boutique est ouverte.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="courrier" tabindex="0" role="button"><h3>Tes achats tombent en fenêtre de butin <span class="chip c-new">Achats</span></h3><p>Le <b>jeton d’Adhésion</b> et les <b>rênes de la monture du pack annuel</b> arrivent par courrier sous garde du serveur : une <b>fenêtre de butin</b> s’ouvre dès que la lettre atterrit, la récupération marche <b>partout</b>, et ça tombe même <b>sacs pleins</b>.</p><span class="more-link">Voir le détail</span></div><div class="card"><h3>Connexions et sauvegardes <span class="chip c-util">Technique</span></h3><p>Une <b>session révoquée</b> ne peut plus terminer une connexion en cours ; à l’extinction, le serveur <b>attend les sauvegardes de personnages</b> en vol et signale celles qui n’aboutissent pas. Dépendances vulnérables mises à jour.</p></div></div></section><div class="note"><b>Ce que ça change pour toi :</b> si tu montes un nouveau visage entre les niveaux 5 et 15, les combats raccourcissent nettement — le mur des PV attend le niveau 20. Et si ton paiement d’Adhésion restait coincé, c’est la version qui le débloque.</div></div><dialog id="modal" aria-labelledby="mTitle"><div class="modal-head"><h3 id="mTitle"></h3><button class="close" id="mClose" aria-label="Fermer">✕</button></div><div class="modal-body" id="mBody"></div></dialog><script>const DETAILS={
"pvmobs":{"title":"Les PV des monstres, en pente douce","summary":"Échelle écrite jusqu’au niveau 5, +0,15 par niveau ensuite, ×3,25 au niveau 20 — les dégâts ne bougent pas.","body":"<h4>La nouvelle courbe</h4><ul><li>Jusqu’au <b>niveau 5</b> : les PV restent à l’échelle écrite (×1) — les tout premiers combats restent aussi faciles qu’avant la v0.45.0.</li><li>De 5 à 20 : <b>+0,15 de PV par niveau</b> — <b>×1,45 au niveau 8</b>, ×1,75 à 10, ×2,35 à 14, jusqu’à <b>×3,25 au niveau 20</b>.</li><li>La v0.45.0 atteignait ce triple <b>dès le niveau 8</b> : les combats de début de monde duraient trop. La cible du niveau 20 est <b>inchangée</b> (choix du studio).</li><li><b>Les dégâts des mobs gardent leur courbe d’origine</b> : ×1,35 au niveau 8 et au-delà, armure inchangée.</li></ul><h4>Pourquoi</h4><ul><li>La pente de la v0.45.0 rendait les combats des niveaux 5 à 15 beaucoup trop longs pour l’équipement qu’on y porte ; la pente douce raccourcit nettement ces combats sans raboter le défi du monde de niveau 20.</li></ul>"},
"elites":{"title":"Le plancher de santé des élites","summary":"Une élite faible ne peut plus tomber sous la santé d’un monstre normal mis à l’échelle.","body":"<h4>Ce qui change</h4><ul><li>Avant : les élites <b>étaient exclues</b> de l’échelle du monde ouvert et gardaient leur santé écrite, même très en dessous du niveau.</li><li>Maintenant : la santé d’une élite est comparée à <b>l’ancre d’un monstre normal</b> (40 + 18 × niveau, multiplié par l’échelle de PV du niveau) ; si elle est en dessous, elle est <b>ramenée à ce plancher</b>.</li><li>Le multiplicateur <b>élite ×2,3</b> existant s’applique ensuite ; les <b>élites nommées</b>, déjà plus solides que l’ancre, gardent leur santé écrite à l’identique.</li><li><b>Dégâts et armure d’élite ne bougent pas.</b></li></ul>"},
"adhesion":{"title":"Adhésion : le checkout reparle","summary":"Checkout Stripe réparé, surclassement mensuel→annuel récupéré après un abandon, statut rafraîchi.","body":"<h4>Ce qui est réparé</h4><ul><li>Le <b>checkout Stripe embarqué</b> refonctionne : les secrets encodés de la commande sont préservés, plus d’écran figé.</li><li>L’offre de surclassement <b>mensuel→annuel</b> reste disponible après un <b>checkout abandonné</b> — elle n’est plus avalée par la tentative.</li><li>Le <b>statut d’Adhésion se rafraîchit</b> pendant que la boutique est ouverte : la fenêtre affiche ton vrai abonnement sans recharger.</li><li>Confirmation d’achat, livraison des récompenses d’Adhésion et retour d’échange des <b>jetons</b> : les messages sont plus clairs, l’onglet Adhésions est reconstruit.</li></ul><h4>Et côté serveur</h4><ul><li>La livraison passe par le service des <b>récompenses quotidiennes</b> (correctifs #42 et #43) ; le format du monde reste au <b>48</b>, rien à refaire de ton côté.</li></ul>"},
"courrier":{"title":"Les achats arrivent en fenêtre de butin","summary":"Jeton d’Adhésion et rênes annuelles arrivent par courrier sous garde, récupérables partout, même sacs pleins.","body":"<h4>Comment ça marche</h4><ul><li>Un achat validé arrive comme une <b>lettre sous garde du serveur</b> (courrier système avec référence de commande) : impossible d’en falsifier une.</li><li>Quand la lettre atterrit — ou à ta <b>reconnexion</b>, si elle t’attendait — une <b>fenêtre de butin</b> s’ouvre toute seule.</li><li>La prise se fait <b>n’importe où</b> : plus besoin d’aller jusqu’à un pilier aux corbeaux.</li><li>Les récompenses payées (le <b>jeton d’Adhésion</b>, les <b>rênes des montures du pack annuel</b>) tombent même avec des <b>sacs pleins</b>, en débordement visible à l’inventaire ; le reste d’une lettre garde la règle de capacité normale.</li></ul>"},
