<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>What's new in v0.44.4 — La Clauderie</title><meta name="description" content="v0.44.4: hill standings with a Weekly Vault win, the Weekly Vault counts repeat Nythraxis clears, treasure guests uncapped, Grumbol odds at the final chest cut fourfold, and difficulty switching without re-forming."><meta name="theme-color" content="#c8a04b"><meta property="og:type" content="website"><meta property="og:site_name" content="La Clauderie"><meta property="og:title" content="What's new in v0.44.4 — La Clauderie"><meta property="og:url" content="https://laclauderie.fr/notes/v0.44.4.html"><link rel="canonical" href="https://laclauderie.fr/notes/v0.44.4.html"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icon-180.png"><script src="../assets/pwa.js" defer></script><script>if(localStorage.getItem('lang')!=='en')location.replace('v0.44.4.html'+location.hash);</script><style>
  :root {

  .c-new { color: var(--heal); } .c-raid { color: var(--gold); } .c-pvp { color: var(--dps); }
  .c-bal { color: var(--q-legendary); } .c-mob { color: var(--arcane); } .c-epic { color: var(--q-epic); }
  .c-plate { color: var(--dps); } .c-leather { color: var(--heal); } .c-cloth { color: var(--arcane); } .c-util { color: var(--q-rare); }

  .statline { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim); }
  .statline b { color: var(--text); }

<body><div class="topbar"><div class="row"><a href="../index.html" class="brand"><span class="sigil">C</span><b>La Clauderie</b></a><nav class="topnav" data-guild-nav data-current="news" aria-label="Site navigation"></nav></div></div><div class="wrap"><header class="hero"><p class="eyebrow">World of ClaudeCraft · Patch notes</p><h1>What's new in <span class="v">v0.44.4</span></h1><p class="lede">The hills gain their <strong class="hl">standings</strong> — and a Weekly Vault win for the best hold. The Weekly Vault now counts repeat Nythraxis clears, Buried Hoard guests are uncapped… but Grumbol's odds at the final chest are <strong class="hl">cut fourfold</strong>. And a party leader switches difficulty without re-forming.</p><div class="meta"><span><b>Released</b> October 5, 2026</span><span><b>Since</b> v0.44.3</span><span><b>Fix pass + rewards</b></span></div><div class="hint">💡 Click a card for details.</div></header><nav class="digest" aria-labelledby="digest-title"><h2 id="digest-title">At a glance</h2><p class="sec-sub">The same sections in the same order, every release.</p><ol><li class=""><span class="d-ico">⚔️</span><a class="d-name" href="#classes">Classes &amp; spells</a><span class="d-say"><b class="eq">Classes =</b> no spell, talent or combat change — the DPS page keeps its figures.</span></li><li class="none"><span class="d-ico">🔨</span><a class="d-name" href="#metiers">Professions &amp; gathering</a><span class="d-say">—</span></li><li class=""><span class="d-ico">🐉</span><a class="d-name" href="#donjons">Dungeons, rifts &amp; bosses</a><span class="d-say"><b class="up">Weekly Vault ↑</b> every final raid boss counts, repeat Nythraxis included.</span></li><li class=""><span class="d-ico">🗺️</span><a class="d-name" href="#monde">World &amp; quests</a><span class="d-say"><b class="up">Guests ↑</b> no more 3-payout limit per cycle; <b class="down">Grumbol ↓</b> at the final chest: 0.25 → 1% by rarity.</span></li><li class=""><span class="d-ico">🏰</span><a class="d-name" href="#guilde">Guild &amp; social</a><span class="d-say"><b class="up">Hills ↑</b> standings every 5 minutes and a Weekly Vault win at the fall.</span></li><li class=""><span class="d-ico">⚙️</span><a class="d-name" href="#confort">Quality of life &amp; tech</a><span class="d-say">The game site links the guides, real 404s, census repaired.</span></li></ol></nav><section id="classes"><h2><span class="num">01</span>Classes &amp; spells</h2><p class="sec-sub">No spell, talent or combat formula changes: this release rewards differently, it doesn't fight differently.</p><div class="grid cols-2"><div class="card"><h3>No change <span class="chip c-bal">Unchanged</span></h3><p>The site's simulation returns figures identical to v0.44.3: the DPS page doesn't need to go back in the oven.</p></div></div></section><section id="metiers"><h2><span class="num">02</span>Professions &amp; gathering</h2><p class="sec-sub">No recipe, enchant or material in this release.</p><div class="grid cols-3"><div class="card"><h3>No change <span class="chip c-bal">Unchanged</span></h3><p>Nothing new on the profession side.</p></div></div></section><section id="donjons"><h2><span class="num">03</span>Dungeons, rifts &amp; bosses</h2><p class="sec-sub">The Weekly Vault finally counts every raid boss, and switching difficulty becomes one click.</p><div class="grid cols-2"><div class="card"><h3>Weekly Vault: repeats count <span class="chip c-new">New</span></h3><p>Every final raid boss advances the Weekly Vault, including re-clearing Nythraxis: your three best clears set the reward difficulties.</p></div><div class="card"><h3>Switch difficulty without re-forming <span class="chip c-new">New</span></h3><p>The party leader flips the dungeon or raid to normal/heroic without breaking the group — the reset follows the usual "Reset All Instances" rules (leader only, nobody inside, no unlooted loot, five-minute cooldown).</p></div></div></section><section id="monde"><h2><span class="num">04</span>World &amp; quests</h2><p class="sec-sub">The Buried Hoard opens its doors to guests, and narrows the Grumbol window at the chest.</p><div class="grid cols-2"><div class="card"><h3>End of the guest cap <span class="chip c-new">New</span></h3><p>A guest used to be paid only 3 times per World Quest cycle: that's over, the payout lands after EVERY eligible chest.</p></div><div class="card more" data-detail="chests" tabindex="0" role="button"><h3>Grumbol at the chest: cut fourfold <span class="chip c-bal">Nerf</span></h3><p>The treasure's final chest paid Grumbol at 1 to 5% by rarity: it's now <b>0.25 to 1%</b>. The Clue Scroll caskets keep their 1.5%.</p><span class="more-link">See details</span></div></div></section><section id="guilde"><h2><span class="num">05</span>Guild &amp; social</h2><p class="sec-sub">The hills become a commented sport: regular standings, and a real weekly reward at stake.</p><div class="grid cols-2"><div class="card more" data-detail="hills" tabindex="0" role="button"><h3>Hill standings <span class="chip c-pvp">PvP</span></h3><p>Every 5 minutes and at the fall, the realm hears the top 3 groups by hold time — and the best hold pays a Weekly Vault win.</p><span class="more-link">See details</span></div><div class="card"><h3>The rest of PvP unchanged <span class="chip c-bal">Unchanged</span></h3><p>Streak bounties, PvP Resurrect, /presence and the Warfare table of v0.44.3 stay as they are.</p></div></div></section><section id="confort"><h2><span class="num">06</span>Quality of life &amp; tech</h2><p class="sec-sub">On the game's website side: SEO, honest errors, and up-to-date character pages.</p><div class="grid cols-2"><div class="card"><h3>The game site links the guides <span class="chip c-util">Website</span></h3><p>Homepage, wiki, press and links pages now point to the player guides; missing pages return a proper 404 status to browsers and search engines (visitors see the same page as before).</p></div><div class="card"><h3>Census repaired <span class="chip c-util">Fix</span></h3><p>The daily character census on parses.worldofclaudecraft.com runs again — it had been failing since October 4, leaving character pages on an old snapshot.</p></div></div></section><div class="note"><b>What this means for you:</b> re-running Nythraxis finally serves your week, holding a hill with your group moves you toward the Weekly Vault, and tagging along on other people's maps no longer pays nothing. On the other hand, if Grumbol is your dream mount, the Clue Scroll caskets are the best road again — the final chest seriously tightened the tap.</div></div><dialog id="modal" aria-labelledby="mTitle"><div class="modal-head"><h3 id="mTitle"></h3><button class="close" id="mClose" aria-label="Close">✕</button></div><div class="modal-body" id="mBody"></div></dialog><script>const DETAILS={
"hills":{"title":"Hill standings, and the weekly win","summary":"The realm tracks who holds the hill, comments on it every 5 minutes, and pays the best hold a real Weekly Vault win.","body":"<h4>The commentary</h4><ul><li>While a hill stands, the realm hears a reminder <b>every 5 minutes</b>: where it is, how long is left.</li><li>Each reminder — and the fall — announces the <b>top 3 groups</b> ranked by hold time. A party is named by its leader, a lone player by name.</li></ul><h4>How you earn your place</h4><p>A group banks the seconds the hill was held <b>with at least one member inside</b>, across every separate hold of the same stand: a group that walked away banks nothing — you can't win from your couch.</p><h4>The reward</h4><p>When the hill falls, if the longest-holding group held it for <b>at least 10 minutes in total</b>, every player who stood <b>at least 1 minute inside</b> for that group — and is still in it — earns <b>one win toward the Weekly Vault's PvP row</b> (capped at a party's size, so five players at most).</p>"},
"chests":{"title":"Buried Hoard: guests at will, Grumbol on a drip","summary":"The 3-payouts-per-cycle guest cap is gone; in exchange, Grumbol's odds at the final chest are sharply reduced.","body":"<h4>Guests: no more cap</h4><p>Until now, a player GUESTED into someone else's vault got paid only <b>3 times per cycle</b> of World Quests (the owner's own maps were never capped). The limit is gone: every eligible chest pays, whatever your counter says.</p><h4>Grumbol at the final chest: nerf</h4><ul><li>Before: <b>1%</b> on a common map, <b>1.5%</b> rare, <b>2.5%</b> epic, <b>5%</b> legendary (about 1.3% on average).</li><li>Now: <b>0.25%</b> common, <b>0.5%</b> rare, <b>0.75%</b> epic, <b>1%</b> legendary (about 0.475% on average). The official notes give the new figures without saying it: these odds were CUT roughly fourfold.</li><li><b>The second source doesn't move</b>: the <b>Clue Scroll caskets</b> keep their Grumbol at <b>1.5%</b> — they are the best road to the mount again.</li></ul>"},
};const modal=document.getElementById('modal'),mTitle=document.getElementById('mTitle'),mBody=document.getElementById('mBody');let lastFocus=null;function openModal(k){const x=DETAILS[k];if(!x)return;lastFocus=document.activeElement;mTitle.textContent=x.title;mBody.innerHTML=(x.summary?'<p class="summary">'+x.summary+'</p>':'')+x.body;if(window.CodexPopup)CodexPopup.enhance(mBody);if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}function closeModal(){if(typeof modal.close==='function')modal.close();else modal.removeAttribute('open');if(lastFocus)lastFocus.focus();}document.querySelectorAll('[data-detail]').forEach(e=>{e.addEventListener('click',()=>openModal(e.dataset.detail));e.addEventListener('keydown',x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();openModal(e.dataset.detail);}})});document.getElementById('mClose').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});modal.addEventListener('cancel',()=>{if(lastFocus)lastFocus.focus();});</script><script src="../assets/codex-popup.js" defer></script><script src="../assets/nav.js"></script><script src="../assets/lang.js"></script><script src="../assets/version.js" data-version="v0.44.4" defer></script></body></html>
