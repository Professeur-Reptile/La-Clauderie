<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Nouveautés v0.45.2 — La Clauderie</title><meta name="description" content="La v0.45.2 rattrape les correctifs v0.44.x manqués à l'intégration de la v0.45.0 (Nythraxis, collines, Guerre, Chambre forte) et améliore l'Adhésion : paiement intégré au jeu, abonnements cumulables, monture annuelle partagée sur tout le compte."><meta name="theme-color" content="#c8a04b"><meta property="og:type" content="website"><meta property="og:site_name" content="La Clauderie"><meta property="og:title" content="Nouveautés v0.45.2 — La Clauderie"><meta property="og:url" content="https://laclauderie.fr/notes/v0.45.2.html"><link rel="canonical" href="https://laclauderie.fr/notes/v0.45.2.html"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icon-180.png"><script src="../assets/pwa.js" defer></script><script>if(localStorage.getItem('lang')==='en')location.replace('v0.45.2.en.html'+location.hash);</script><style>
  :root {
    --bg: #0b0d12; --bg-card: #161a24; --bg-card-hover: #1a1f2b; --bg-modal: #12161f;
    --line: #262c3a; --line-soft: #1e2431;
    --gold: #c8a04b; --gold-bright: #e6c37a;
    --text: #dfe3ea; --dim: #8b93a3; --faint: #5b6272;
    --q-rare: #2f8bff; --q-epic: #a335ee; --q-legendary: #ff8000;
    --dps: #e5544a; --heal: #58c46a; --arcane: #58b6c9; --discord: #5865f2;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    line-height: 1.55; -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 900px 460px at 15% -8%, rgba(200,160,75,0.09), transparent 70%),
      radial-gradient(ellipse 760px 400px at 88% -4%, rgba(47,139,255,0.06), transparent 70%);
  }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 28px); }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-soft); }
  .topbar .row { max-width: 960px; margin: 0 auto; padding: 8px clamp(16px,4vw,28px); display: flex; align-items: center; gap: 14px; min-height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .sigil { width: 26px; height: 30px; flex: none; background: linear-gradient(160deg, var(--gold-bright), var(--gold) 55%, #8a6d2e); clip-path: polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%); display: grid; place-items: center; color: #1a130a; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; }
  .brand b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .topnav { margin-left: auto; display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; font-size: 0.88rem; }
  .topnav a { color: var(--dim); text-decoration: none; }
  .topnav a:hover { color: var(--gold-bright); }
  .topnav .cur { color: var(--gold-bright); font-weight: 600; }
  @media (max-width: 620px) { .brand b { display: none; } .topnav { gap: 4px 11px; font-size: 0.82rem; } }

  /* Hero */
  .hero { padding: clamp(40px, 7vw, 72px) 0 clamp(24px, 4vw, 40px); border-bottom: 1px solid var(--line-soft); }
  .eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.4rem, 7vw, 3.8rem); line-height: 1; margin: 0 0 12px; }
  h1 .v { color: var(--gold-bright); }
  .lede { color: var(--dim); font-size: clamp(1rem, 2.2vw, 1.2rem); max-width: 58ch; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--faint); }
  .meta b { color: var(--dim); }
  .hint { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; background: color-mix(in srgb, var(--gold) 10%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); color: var(--gold-bright); padding: 8px 14px; border-radius: 8px; font-size: 0.86rem; }

  /* Sections */
  section { padding: clamp(26px, 4vw, 40px) 0; border-top: 1px solid var(--line-soft); scroll-margin-top: 72px; }
  section:first-of-type { border-top: none; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .sec-num { font-family: var(--font-mono); color: var(--gold); font-size: 0.82rem; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 3.6vw, 2.1rem); margin: 0; }
  .sec-sub { color: var(--dim); margin: -8px 0 20px; max-width: 66ch; }

  .grid { display: grid; gap: 13px; }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .cols-3 { grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); }

  .card { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; padding: 19px; }
  .card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.14rem; margin: 0 0 6px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .card p { margin: 6px 0 0; color: var(--dim); font-size: 0.93rem; }
  .card ul { margin: 10px 0 0; padding-left: 1.05em; color: var(--dim); font-size: 0.9rem; }
  .card ul li { margin: 4px 0; }
  .card ul li::marker { color: var(--gold); }

  /* Bandeau « En un coup d'œil » — mêmes rubriques, même ordre, à chaque
     version : le lecteur prend l'habitude et trouve sa classe sans lire. */
  .digest { padding: clamp(24px, 3.5vw, 34px) 0 clamp(2px, 1vw, 8px); }
  .digest h2 { font-size: clamp(1.2rem, 2.8vw, 1.5rem); margin: 0 0 6px; }
  .digest .sec-sub { margin: 0 0 16px; }
  .digest ol { list-style: none; margin: 0; padding: 0; background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; overflow: hidden; }
  .digest li { display: grid; grid-template-columns: 30px 215px 1fr; align-items: baseline; gap: 3px 12px; padding: 13px 17px; border-top: 1px solid var(--line-soft); }
  .digest li:first-child { border-top: none; }
  .d-ico { font-size: 0.98rem; }
  .d-name { font-weight: 600; color: var(--text); text-decoration: none; }
  a.d-name:hover, a.d-name:focus-visible { color: var(--gold-bright); }
  .d-say { color: var(--dim); font-size: 0.92rem; }
  .digest li.none .d-name, .digest li.none .d-say { color: var(--faint); font-weight: 400; }
  /* Sens du changement, d'un coup d'œil : amélioration, nerf, inchangé. */
  .up { color: var(--heal); font-weight: 600; white-space: nowrap; }
  .down { color: var(--dps); font-weight: 600; white-space: nowrap; }
  .eq { color: var(--dim); font-weight: 600; white-space: nowrap; }
  @media (max-width: 620px) {
    .digest li { grid-template-columns: 26px 1fr; padding: 12px 15px; }
    .d-say { grid-column: 2; }
  }

  /* Clickable cards */
  .card.more { cursor: pointer; transition: border-color .15s, transform .15s, background .15s; position: relative; }
  .card.more:hover { border-color: var(--gold); transform: translateY(-2px); background: var(--bg-card-hover); }
  .card.more:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .more-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; color: var(--gold-bright); font-size: 0.82rem; font-weight: 600; }
  .more-link::after { content: "→"; transition: transform .15s; }
  .card.more:hover .more-link::after { transform: translateX(3px); }

  /* Chips */
  .chip { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; font-weight: 600; white-space: nowrap; }
  .c-new { color: var(--heal); } .c-raid { color: var(--gold); } .c-pvp { color: var(--dps); }
  .c-bal { color: var(--q-legendary); } .c-mob { color: var(--arcane); } .c-epic { color: var(--q-epic); }
  .c-plate { color: var(--dps); } .c-leather { color: var(--heal); } .c-cloth { color: var(--arcane); } .c-util { color: var(--q-rare); }

  .statline { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim); }
  .statline b { color: var(--text); }
  .grp-title { font-family: var(--font-display); font-size: 1rem; color: var(--dim); margin: 22px 0 12px; }
  .compact { columns: 2; column-gap: 34px; }
  .compact li { margin: 5px 0; }
  @media (max-width: 560px) { .compact { columns: 1; } }
  strong.hl { color: var(--text); font-weight: 600; }

  /* Modal */
  dialog { padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-modal); color: var(--text); max-width: 640px; width: calc(100% - 28px); max-height: 86vh; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  dialog::backdrop { background: rgba(4,6,10,0.72); backdrop-filter: blur(3px); }
  .modal-head { position: sticky; top: 0; background: linear-gradient(180deg, var(--bg-modal), color-mix(in srgb, var(--bg-modal) 88%, transparent)); border-bottom: 1px solid var(--line-soft); padding: 18px 22px; display: flex; align-items: flex-start; gap: 14px; }
  .modal-head h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; margin: 0; line-height: 1.15; }
  .modal-head .close { margin-left: auto; flex: none; background: var(--bg-card); border: 1px solid var(--line); color: var(--dim); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .modal-head .close:hover { color: var(--text); border-color: var(--gold); }
  .modal-body { padding: 20px 22px 26px; overflow-y: auto; }
  .modal-body .summary { color: var(--dim); font-style: italic; margin: 0 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
  .modal-body h4 { font-family: var(--font); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-bright); margin: 22px 0 8px; }
  .modal-body h4:first-of-type { margin-top: 0; }
  .modal-body p { margin: 0 0 10px; font-size: 0.94rem; color: var(--text); }
  .modal-body ul { margin: 0 0 10px; padding-left: 1.15em; }
  .modal-body li { margin: 6px 0; font-size: 0.93rem; }
  .modal-body li::marker { color: var(--gold); }
  .modal-body b { color: var(--gold-bright); font-weight: 600; }
  .kbd { font-family: var(--font-mono); background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 0.85em; color: var(--text); }

  .note { margin-top: 8px; background: color-mix(in srgb, var(--gold) 8%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 11px; padding: 16px 19px; color: var(--dim); font-size: 0.94rem; }
  .note b { color: var(--gold-bright); }

  footer { border-top: 1px solid var(--line-soft); padding: 28px 0 54px; color: var(--faint); font-size: 0.82rem; text-align: center; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--gold-bright); }

<body><div class="topbar"><div class="row"><a href="../index.html" class="brand"><span class="sigil">C</span><b>La Clauderie</b></a><nav class="topnav" data-guild-nav data-current="news" aria-label="Navigation du site"></nav></div></div><div class="wrap"><header class="hero"><p class="eyebrow">World of ClaudeCraft · Notes de version</p><h1>Nouveautés <span class="v">v0.45.2</span></h1><p class="lede">Le <strong class="hl">rattrapage</strong> : les correctifs des v0.44.x que la grosse intégration avait égarés retrouvent leur place — Nythraxis, collines, Guerre, Chambre forte — et l’<strong class="hl">Adhésion</strong> se paie désormais <strong class="hl">dans le jeu</strong>, avec des abonnements qu’on peut empiler.</p><div class="meta"><span><b>Publiée</b> le 26 octobre 2026</span><span><b>Depuis</b> v0.45.1</span><span><b>Correctif + Adhésion</b></span></div><div class="hint">💡 Clique sur une carte pour le détail.</div></header><nav class="digest" aria-labelledby="digest-title"><h2 id="digest-title">En un coup d’œil</h2><p class="sec-sub">Les mêmes rubriques à chaque version, dans le même ordre.</p><ol><li class="none"><span class="d-ico">⚔️</span><a class="d-name" href="#classes">Classes &amp; sorts</a><span class="d-say">—</span></li><li class="none"><span class="d-ico">🔨</span><a class="d-name" href="#metiers">Métiers &amp; récolte</a><span class="d-say">—</span></li><li class=""><span class="d-ico">🐉</span><a class="d-name" href="#donjons">Donjons, failles &amp; boss</a><span class="d-say">Nythraxis retrouve sa v0.44.x ; la Chambre forte reprend invités et répétitions.</span></li><li class="none"><span class="d-ico">🗺️</span><a class="d-name" href="#monde">Monde &amp; quêtes</a><span class="d-say">Retour des restrictions de quêtes mondiales et des conforts de présence.</span></li><li class=""><span class="d-ico">🏰</span><a class="d-name" href="#guilde">Guilde &amp; social</a><span class="d-say">Les collines reviennent complètes : primes, classements, alertes, carte.</span></li><li class=""><span class="d-ico">⚙️</span><a class="d-name" href="#confort">Confort &amp; technique</a><span class="d-say"><b class="up">Adhésion ↑</b> paiement intégré au jeu, abonnements empilables, monture annuelle partagée.</span></li></ol></nav><section id="classes"><h2><span class="num">01</span>Classes &amp; sorts</h2><p class="sec-sub">Aucune formule de classe ne change dans ce rattrapage.</p><div class="grid cols-2"><div class="card"><h3>Aucun changement <span class="chip c-bal">Égalité</span></h3><p>Les neuf visages des classes restent ceux de la v0.45.0 — la page DPS garde ses chiffres.</p></div></div></section><section id="metiers"><h2><span class="num">02</span>Métiers &amp; récolte</h2><p class="sec-sub">Rien de neuf côté métiers.</p><div class="grid cols-3"><div class="card"><h3>Aucun changement <span class="chip c-bal">Égalité</span></h3><p>Qualité de butin, réactifs signés et chef-d’œuvre suivent la v0.45.0.</p></div></div></section><section id="donjons"><h2><span class="num">03</span>Donjons, failles &amp; boss</h2><p class="sec-sub">Nythraxis et la Chambre forte hebdo retrouvent leurs règles de la v0.44.x, perdues à la fusion.</p><div class="grid cols-2"><div class="card"><h3>Nythraxis reprend sa forme <span class="chip c-util">Correctif</span></h3><p>La <b>Tempête d’os</b> reste retirée de son arsenal, le <b>Soul Rend</b> retrouve son écart de temps avec la Grave Eruption, et les exclusions de piliers sont restaurées — le raid se joue comme en fin de v0.44.x.</p></div><div class="card"><h3>Chambre forte et Trésor enterré <span class="chip c-util">Correctif</span></h3><p>L’<b>accès invité</b> au coffre du Trésor enterré et à la Chambre forte est de retour, avec l’<b>éligibilité hebdomadaire</b> et le comportement des <b>clears répétés</b> — la remise des récompenses reste atomique, comme en v0.45.0.</p></div></div></section><section id="monde"><h2><span class="num">04</span>Monde &amp; quêtes</h2><p class="sec-sub">Les garde-fous perdus à la fusion reviennent.</p><div class="grid cols-2"><div class="card"><h3>Restrictions de quêtes mondiales <span class="chip c-util">Correctif</span></h3><p>Le bloc des quêtes mondiales de la v0.44.6 et les règles de présence retrouvent leur intégrité : la vie privée de la présence et les contrôles de modération sont restaurés.</p></div><div class="card"><h3>Retouches d’interface <span class="chip c-util">Correctif</span></h3><p>Le <b>Shift-glisser</b> reprend son comportement d’avant, les infobulles retrouvent leurs textes, et le cache de shaders ainsi que la configuration de compression WebSocket sont réparés.</p></div></div></section><section id="guilde"><h2><span class="num">05</span>Guilde &amp; social</h2><p class="sec-sub">Les collines redeviennent ce qu’elles étaient en fin de v0.44.x — et les deux systèmes de primes cohabitent.</p><div class="grid cols-2"><div class="card"><h3>Les collines complètes <span class="chip c-util">Correctif</span></h3><p><b>Primes de série</b>, <b>classements</b> de détention, <b>alertes</b> au royaume, <b>marques sur la carte</b> et l’éligibilité de tenue minimale pour la Chambre forte : tout le paquet v0.44.3/v0.44.4 est de retour.</p></div><div class="card"><h3>Guerre réapprovisionnée <span class="chip c-util">Correctif</span></h3><p>L’<b>équipement de Guerre manquant</b>, les règles de vendeur et les illustrations d’objets sont restaurés — le catalogue FURY redevient complet.</p></div></div></section><section id="confort"><h2><span class="num">06</span>Confort &amp; technique</h2><p class="sec-sub">L’Adhésion gagne son vrai parcours d’achat, dans le jeu et sans popup.</p><div class="grid cols-2"><div class="card more" data-detail="checkout" tabindex="0" role="button"><h3>Le paiement entre en jeu <span class="chip c-new">Nouveau</span></h3><p>Le paiement de l’Adhésion se fait <b>dans une fenêtre du jeu</b>, plus dans un popup externe — et les abonnements <b>mensuels ou annuels</b> achetés prolongent l’abonnement en cours au lieu de le remplacer.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="monture-annuelle" tabindex="0" role="button"><h3>La monture annuelle, pour tout le compte <span class="chip c-new">Nouveau</span></h3><p>L’<b>onglet Adhésions</b> débarque dans le jeu, la monture annuelle devient <b>partagée par compte</b>, et racheter une année n’enovie plus de rênes en double.</p><span class="more-link">Voir le détail</span></div></div></section><div class="note"><b>Ce que ça change pour toi :</b> le jeu redevient la somme de tout ce qui avait été construit avant — et payer son Adhésion se fait sans quitter la fenêtre du jeu. Aucun équilibrage de classe : la page DPS garde ses chiffres.</div></div><dialog id="modal" aria-labelledby="mTitle"><div class="modal-head"><h3 id="mTitle"></h3><button class="close" id="mClose" aria-label="Fermer">✕</button></div><div class="modal-body" id="mBody"></div></dialog><script>const DETAILS={
"checkout":{"title":"Payer son Adhésion depuis le jeu","summary":"Fin du popup externe : le paiement s’ouvre dans une fenêtre du jeu, et les achats s’empilent.","body":"<h4>Ce qui change</h4><ul><li>Le paiement s’ouvre <b>dans une fenêtre du jeu</b>, plus dans un popup externe — le parcours ne te fait plus quitter la partie.</li><li>Un achat <b>mensuel ou annuel</b> acheté pendant un abonnement actif le <b>prolonge</b> au lieu de le remplacer : les durées s’empilent.</li><li>Les traductions du parcours sont complétées dans toutes les langues de la version.</li></ul><h4>Et côté Discord</h4><ul><li>Le studio reçoit une notification quand un <b>essai</b> démarre et quand un essai se convertit en <b>abonnement payant</b> — invisible pour toi, utile à la maintenance du service.</li></ul>"},
"monture-annuelle":{"title":"La monture annuelle, partagée sur tout le compte","summary":"Un achat, une monture pour tous tes personnages — et jamais de rênes en double.","body":"<h4>Ce qui change</h4><ul><li>La monture annuelle appartient désormais au <b>compte entier</b> : tous tes personnages peuvent la seller.</li><li>Racheter une année <b>n’envoie plus de rênes en double</b> par courrier : la possession est reconnue, seule la durée s’ajoute.</li><li>Un nouvel <b>onglet Adhésions</b> dans le jeu montre ton abonnement, ses durées empilées et l’historique des achats.</li></ul>"},
};const modal=document.getElementById('modal'),mTitle=document.getElementById('mTitle'),mBody=document.getElementById('mBody');let lastFocus=null;function openModal(k){const x=DETAILS[k];if(!x)return;lastFocus=document.activeElement;mTitle.textContent=x.title;mBody.innerHTML=(x.summary?'<p class="summary">'+x.summary+'</p>':'')+x.body;if(window.CodexPopup)CodexPopup.enhance(mBody);if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}function closeModal(){if(typeof modal.close==='function')modal.close();else modal.removeAttribute('open');if(lastFocus)lastFocus.focus();}document.querySelectorAll('[data-detail]').forEach(e=>{e.addEventListener('click',()=>openModal(e.dataset.detail));e.addEventListener('keydown',x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();openModal(e.dataset.detail);}})});document.getElementById('mClose').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});modal.addEventListener('cancel',()=>{if(lastFocus)lastFocus.focus();});</script><script src="../assets/codex-popup.js" defer></script><script src="../assets/nav.js"></script><script src="../assets/lang.js"></script><script src="../assets/version.js" data-version="v0.45.2" defer></script></body></html>
