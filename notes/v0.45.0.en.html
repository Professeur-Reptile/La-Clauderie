<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>What's new in v0.45.0 — La Clauderie</title><meta name="description" content="v0.45.0, the game's biggest update yet: every town and five dungeons rebuilt, the Membership subscription (purchases not open yet), a release gift (an appearance redesign + reset lockouts), the Groveheart druid reinvented, the hunter reworked, mounts made cosmetic, and Enhancement/Feral moved to Strength."><meta name="theme-color" content="#c8a04b"><meta property="og:type" content="website"><meta property="og:site_name" content="La Clauderie"><meta property="og:title" content="What's new in v0.45.0 — La Clauderie"><meta property="og:url" content="https://laclauderie.fr/notes/v0.45.0.html"><link rel="canonical" href="https://laclauderie.fr/notes/v0.45.0.html"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icon-180.png"><script src="../assets/pwa.js" defer></script><script>if(localStorage.getItem('lang')!=='en')location.replace('v0.45.0.html'+location.hash);</script><style>
  :root {
    --bg: #0b0d12; --bg-card: #161a24; --bg-card-hover: #1a1f2b; --bg-modal: #12161f;
    --line: #262c3a; --line-soft: #1e2431;
    --gold: #c8a04b; --gold-bright: #e6c37a;
    --text: #dfe3ea; --dim: #8b93a3; --faint: #5b6272;
    --q-rare: #2f8bff; --q-epic: #a335ee; --q-legendary: #ff8000;
    --dps: #e5544a; --heal: #58c46a; --arcane: #58b6c9; --discord: #5865f2;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    line-height: 1.55; -webkit-font-smoothing: antialiased;
    background-image:
      radial-gradient(ellipse 900px 460px at 15% -8%, rgba(200,160,75,0.09), transparent 70%),
      radial-gradient(ellipse 760px 400px at 88% -4%, rgba(47,139,255,0.06), transparent 70%);
  }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 28px); }

  /* Topbar */
  .topbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line-soft); }
  .topbar .row { max-width: 960px; margin: 0 auto; padding: 8px clamp(16px,4vw,28px); display: flex; align-items: center; gap: 14px; min-height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .sigil { width: 26px; height: 30px; flex: none; background: linear-gradient(160deg, var(--gold-bright), var(--gold) 55%, #8a6d2e); clip-path: polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%); display: grid; place-items: center; color: #1a130a; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; }
  .brand b { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }
  .topnav { margin-left: auto; display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap; font-size: 0.88rem; }
  .topnav a { color: var(--dim); text-decoration: none; }
  .topnav a:hover { color: var(--gold-bright); }
  .topnav .cur { color: var(--gold-bright); font-weight: 600; }
  @media (max-width: 620px) { .brand b { display: none; } .topnav { gap: 4px 11px; font-size: 0.82rem; } }

  /* Hero */
  .hero { padding: clamp(40px, 7vw, 72px) 0 clamp(24px, 4vw, 40px); border-bottom: 1px solid var(--line-soft); }
  .eyebrow { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0 0 14px; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.4rem, 7vw, 3.8rem); line-height: 1; margin: 0 0 12px; }
  h1 .v { color: var(--gold-bright); }
  .lede { color: var(--dim); font-size: clamp(1rem, 2.2vw, 1.2rem); max-width: 58ch; margin: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 20px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--faint); }
  .meta b { color: var(--dim); }
  .hint { display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; background: color-mix(in srgb, var(--gold) 10%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); color: var(--gold-bright); padding: 8px 14px; border-radius: 8px; font-size: 0.86rem; }

  /* Sections */
  section { padding: clamp(26px, 4vw, 40px) 0; border-top: 1px solid var(--line-soft); scroll-margin-top: 72px; }
  section:first-of-type { border-top: none; }
  .sec-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .sec-num { font-family: var(--font-mono); color: var(--gold); font-size: 0.82rem; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 3.6vw, 2.1rem); margin: 0; }
  .sec-sub { color: var(--dim); margin: -8px 0 20px; max-width: 66ch; }

  .grid { display: grid; gap: 13px; }
  .cols-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
  .cols-3 { grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); }

  .card { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; padding: 19px; }
  .card h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.14rem; margin: 0 0 6px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .card p { margin: 6px 0 0; color: var(--dim); font-size: 0.93rem; }
  .card ul { margin: 10px 0 0; padding-left: 1.05em; color: var(--dim); font-size: 0.9rem; }
  .card ul li { margin: 4px 0; }
  .card ul li::marker { color: var(--gold); }

  /* Bandeau « En un coup d'œil » — mêmes rubriques, même ordre, à chaque
     version : le lecteur prend l'habitude et trouve sa classe sans lire. */
  .digest { padding: clamp(24px, 3.5vw, 34px) 0 clamp(2px, 1vw, 8px); }
  .digest h2 { font-size: clamp(1.2rem, 2.8vw, 1.5rem); margin: 0 0 6px; }
  .digest .sec-sub { margin: 0 0 16px; }
  .digest ol { list-style: none; margin: 0; padding: 0; background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; overflow: hidden; }
  .digest li { display: grid; grid-template-columns: 30px 215px 1fr; align-items: baseline; gap: 3px 12px; padding: 13px 17px; border-top: 1px solid var(--line-soft); }
  .digest li:first-child { border-top: none; }
  .d-ico { font-size: 0.98rem; }
  .d-name { font-weight: 600; color: var(--text); text-decoration: none; }
  a.d-name:hover, a.d-name:focus-visible { color: var(--gold-bright); }
  .d-say { color: var(--dim); font-size: 0.92rem; }
  .digest li.none .d-name, .digest li.none .d-say { color: var(--faint); font-weight: 400; }
  /* Sens du changement, d'un coup d'œil : amélioration, nerf, inchangé. */
  .up { color: var(--heal); font-weight: 600; white-space: nowrap; }
  .down { color: var(--dps); font-weight: 600; white-space: nowrap; }
  .eq { color: var(--dim); font-weight: 600; white-space: nowrap; }
  @media (max-width: 620px) {
    .digest li { grid-template-columns: 26px 1fr; padding: 12px 15px; }
    .d-say { grid-column: 2; }
  }

  /* Clickable cards */
  .card.more { cursor: pointer; transition: border-color .15s, transform .15s, background .15s; position: relative; }
  .card.more:hover { border-color: var(--gold); transform: translateY(-2px); background: var(--bg-card-hover); }
  .card.more:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .more-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; color: var(--gold-bright); font-size: 0.82rem; font-weight: 600; }
  .more-link::after { content: "→"; transition: transform .15s; }
  .card.more:hover .more-link::after { transform: translateX(3px); }

  /* Chips */
  .chip { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; font-weight: 600; white-space: nowrap; }
  .c-new { color: var(--heal); } .c-raid { color: var(--gold); } .c-pvp { color: var(--dps); }
  .c-bal { color: var(--q-legendary); } .c-mob { color: var(--arcane); } .c-epic { color: var(--q-epic); }
  .c-plate { color: var(--dps); } .c-leather { color: var(--heal); } .c-cloth { color: var(--arcane); } .c-util { color: var(--q-rare); }

  .statline { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim); }
  .statline b { color: var(--text); }
  .grp-title { font-family: var(--font-display); font-size: 1rem; color: var(--dim); margin: 22px 0 12px; }
  .compact { columns: 2; column-gap: 34px; }
  .compact li { margin: 5px 0; }
  @media (max-width: 560px) { .compact { columns: 1; } }
  strong.hl { color: var(--text); font-weight: 600; }

  /* Modal */
  dialog { padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-modal); color: var(--text); max-width: 640px; width: calc(100% - 28px); max-height: 86vh; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  dialog::backdrop { background: rgba(4,6,10,0.72); backdrop-filter: blur(3px); }
  .modal-head { position: sticky; top: 0; background: linear-gradient(180deg, var(--bg-modal), color-mix(in srgb, var(--bg-modal) 88%, transparent)); border-bottom: 1px solid var(--line-soft); padding: 18px 22px; display: flex; align-items: flex-start; gap: 14px; }
  .modal-head h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; margin: 0; line-height: 1.15; }
  .modal-head .close { margin-left: auto; flex: none; background: var(--bg-card); border: 1px solid var(--line); color: var(--dim); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .modal-head .close:hover { color: var(--text); border-color: var(--gold); }
  .modal-body { padding: 20px 22px 26px; overflow-y: auto; }
  .modal-body .summary { color: var(--dim); font-style: italic; margin: 0 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
  .modal-body h4 { font-family: var(--font); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-bright); margin: 22px 0 8px; }
  .modal-body h4:first-of-type { margin-top: 0; }
  .modal-body p { margin: 0 0 10px; font-size: 0.94rem; color: var(--text); }
  .modal-body ul { margin: 0 0 10px; padding-left: 1.15em; }
  .modal-body li { margin: 6px 0; font-size: 0.93rem; }
  .modal-body li::marker { color: var(--gold); }
  .modal-body b { color: var(--gold-bright); font-weight: 600; }
  .kbd { font-family: var(--font-mono); background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 0.85em; color: var(--text); }

  .note { margin-top: 8px; background: color-mix(in srgb, var(--gold) 8%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 11px; padding: 16px 19px; color: var(--dim); font-size: 0.94rem; }
  .note b { color: var(--gold-bright); }

  footer { border-top: 1px solid var(--line-soft); padding: 28px 0 54px; color: var(--faint); font-size: 0.82rem; text-align: center; }
  footer a { color: var(--dim); text-decoration: none; }
  footer a:hover { color: var(--gold-bright); }

<body><div class="topbar"><div class="row"><a href="../index.html" class="brand"><span class="sigil">C</span><b>La Clauderie</b></a><nav class="topnav" data-guild-nav data-current="news" aria-label="Site navigation"></nav></div></div><div class="wrap"><header class="hero"><p class="eyebrow">World of ClaudeCraft · Release notes</p><h1>What's new in <span class="v">v0.45.0</span></h1><p class="lede">The game's <strong class="hl">biggest update yet</strong>: the whole world is rebuilt by hand — every town, five dungeons — a <strong class="hl">Membership</strong> system waits for its store to open, every existing character gets a <strong class="hl">release gift</strong>, and on the combat side the healer druid reinvents itself, the hunter is reworked, and Enhancement and Feral move to <strong class="hl">Strength</strong>.</p><div class="meta"><span><b>Released</b> October 25, 2026</span><span><b>Since</b> v0.44.7</span><span><b>Major</b></span></div><div class="hint">💡 Click a card for the details.</div></header><nav class="digest" aria-labelledby="digest-title"><h2 id="digest-title">At a glance</h2><p class="sec-sub">The same sections at every release, in the same order.</p><ol><li class=""><span class="d-ico">⚔️</span><a class="d-name" href="#classes">Classes &amp; spells</a><span class="d-say"><b class="up">Groveheart ↑</b> the Sporemender Form; <b class="up">hunter ↑</b> no minimum ranges; <b class="down">Strength =</b> Enhancement and Feral re-typed.</span></li><li class=""><span class="d-ico">🔨</span><a class="d-name" href="#metiers">Professions &amp; gathering</a><span class="d-say"><b class="up">Quality ↑</b> permanent on earned loot (+2 item levels per tier); signed reagents in the Materials Vault.</span></li><li class=""><span class="d-ico">🐉</span><a class="d-name" href="#donjons">Dungeons, rifts &amp; bosses</a><span class="d-say">Five dungeons rebuilt; <b class="up">Heroic Marks ↑</b> become a currency; the Infernal Quiver.</span></li><li class=""><span class="d-ico">🗺️</span><a class="d-name" href="#monde">World &amp; quests</a><span class="d-say">Thirteen towns by hand; mobs scaled by level; <b class="up">2 world quests ↑</b> pay 150 Honor a day.</span></li><li class=""><span class="d-ico">🏰</span><a class="d-name" href="#guilde">Guild &amp; social</a><span class="d-say">The Lantern Hall; unified dungeon recruitment; a realm message.</span></li><li class=""><span class="d-ico">⚙️</span><a class="d-name" href="#confort">Comfort &amp; tech</a><span class="d-say"><b class="up">Mounts ↑</b> cosmetic + riding ranks; first-person; release gifts; Membership coming.</span></li></ol></nav><section id="classes"><h2><span class="num">01</span>Classes &amp; spells</h2><p class="sec-sub">Two major reworks, an inversion of primary stats, and a handful of adjustments: the meta moves.</p><div class="grid cols-2"><div class="card more" data-detail="groveheart" tabindex="0" role="button"><h3>Groveheart: the Sporemender Form <span class="chip c-new">New</span></h3><p>The healer druid gains its visible signature: the <b>Sporemender</b> form with its own rigged model, <b>Spore Burst</b> (a ground-placed heal with a damage splash), a Typhoon that throws into the air — and Wildbloom renamed Sporemending.</p><span class="more-link">See details</span></div><div class="card more" data-detail="hunter" tabindex="0" role="button"><h3>Hunter: the grand rework <span class="chip c-bal">Balance</span></h3><p>Mobile casts, instant zones, a new <b>Scatterbolt</b> and the novel <b>Play Dead</b>; Fieldcraft rewritten — and <b>no minimum range at all</b>: Auto Shot's dead zone disappears completely.</p><span class="more-link">See details</span></div><div class="card more" data-detail="strength" tabindex="0" role="button"><h3>Enhancement and Feral move to Strength <span class="chip c-bal">Balance</span></h3><p>One primary-stat table for all nine classes: a cat gains <b>nothing</b> from Agility, a bear 1.5 attack power per point — their gear now drops with <b>Strength</b>.</p><span class="more-link">See details</span></div><div class="card"><h3>Rogue, warrior, shaman <span class="chip c-bal">Balance</span></h3><p><b>Skulduggery +25%</b> (and the Brawlmark 2-piece losing its Swift Heels) with a mobility-energy-cooldown pass for the rogue; <b>Iron Resolve</b> shields 20% of max health for the warrior; the shaman's Thundercall kit rebalanced (Lava Flows, Cinder Jolt at 27s). And every class with a delayable cast gains spell pushback immunity at 2 pieces of a PvP set.</p></div></div></section><section id="metiers"><h2><span class="num">02</span>Professions &amp; gathering</h2><p class="sec-sub">Loot quality leaves experimentation to become a permanent system, and the Materials Vault enters crafting.</p><div class="grid cols-2"><div class="card"><h3>Quality settles in <span class="chip c-new">New</span></h3><p>About <b>10%</b> of the non-common weapons, armor and held offhands you earn roll a quality tier (1 to 4): <b>+2 item levels per tier</b>, and a per-item draw of stat weights. It's <b>permanent</b>, across every earned reward source — and a craft's chat line now names the quality it rolled.</p></div><div class="card"><h3>Masterwork in the Materials Vault <span class="chip c-new">New</span></h3><p><b>Signed reagents</b> deposited in the Materials Vault count toward masterwork, and crafted consumables stack across different makers. A recipe's pattern says what it makes on hover, and <b>Prime Cut</b> joins the Buried Hoard chest's material pool.</p></div></div></section><section id="donjons"><h2><span class="num">03</span>Dungeons, rifts &amp; bosses</h2><p class="sec-sub">The release's big build: five dungeons rebuilt on authored open-air fields, and the heroic economy reworked.</p><div class="grid cols-2"><div class="card more" data-detail="dungeons" tabindex="0" role="button"><h3>Five dungeons rebuilt <span class="chip c-new">New</span></h3><p>The <b>Hollow Crypt</b>, <b>Sunken Bastion</b>, <b>Drowned Temple</b>, <b>Wildheart Basin</b> and <b>Gravewyrm Sanctum</b> are remade as hand-built open sceneries, with entrances in the world and a built-in boss guide for every five-player dungeon.</p><span class="more-link">See details</span></div><div class="card more" data-detail="marks" tabindex="0" role="button"><h3>Heroic Marks become a currency <span class="chip c-new">New</span></h3><p><b>Heroic Marks</b> leave your bags for your purse: no more overflow loss, a balance that shows and spends. And a heroic finale pays better: 10g in a five-man, 20g in the raid.</p><span class="more-link">See details</span></div><div class="card"><h3>The Infernal Quiver <span class="chip c-epic">Loot</span></h3><p>Heroic Varkhul's Crucible drops a new epic quiver (2.5%): <b>7 Agi / 4 Sta, Crit 25 + Hit 50</b> — the Crucible's only Hit-carrying offhand. Boss drops finally print to the whole party at the kill, and the Crucible's <b>healer</b> pieces trade Hit for Crit (waists aside).</p></div><div class="card"><h3>The Weekly Vault filters <span class="chip c-util">Adjustment</span></h3><p>The weekly vault only offers gear for <b>your class</b> now, with an optional <b>specialization focus</b>; <b>class-matched raid sigils</b> and <b>Crucible Cores</b> join the rewards, and the PvP row only rolls your class's Season 2.</p></div></div></section><section id="monde"><h2><span class="num">04</span>World &amp; quests</h2><p class="sec-sub">The whole open world is redesigned: hand-built towns, scaled difficulty, and Honor lands in world quests.</p><div class="grid cols-2"><div class="card"><h3>Thirteen towns rebuilt <span class="chip c-new">New</span></h3><p>Eastbrook, Highwatch, Fenbridge and ten painted towns: buildings with <b>walk-in open doorways</b>, taverns with patrons and ambience, the Mirefen inn remade — and the <b>Lantern Hall</b>, Highwatch's adventurers' guild.</p></div><div class="card"><h3>The world, at scale <span class="chip c-bal">Balance</span></h3><p>Open-world mobs scale with level: <b>×3.25 health and ×1.35 damage at level 8</b>, capped beyond (instances keep their own tuning). Every leveling quest now offers a <b>choose-one armor reward</b>, shields join quest rewards (Eastbrook, Mirefen, Thornpeak), and world elites and champions are capped.</p></div><div class="card"><h3>World quests pay Honor <span class="chip c-new">New</span></h3><p>Every day, <b>two slots</b> of the rotation pay <b>150 Honor</b> — the same for the whole realm, redrawn at reset. Enough to fund your Warfare without setting foot in a battleground. In-progress quests become <b>replaceable</b>, and a reward that overflows your bags is <b>mailed</b> to you.</p></div><div class="card"><h3>The world breathes <span class="chip c-new">Interface</span></h3><p>The world map becomes resizable and shows <b>ferry ports with live timetables</b>; a new deed rewards the hedge maze on Hard; your ghost is returned to the <b>last boss you cleared</b>; a rift or Buried Hoard resumes at its portal after a logout.</p></div></div></section><section id="guilde"><h2><span class="num">05</span>Guild &amp; social</h2><p class="sec-sub">A landmark place, a recruitment tool, and a moderation team properly equipped.</p><div class="grid cols-2"><div class="card"><h3>The Lantern Hall <span class="chip c-new">New</span></h3><p>Highwatch gains the adventurers' guild, built in the world's painted style: a landmark to find company — or brag about it.</p></div><div class="card"><h3>Unified recruitment <span class="chip c-new">New</span></h3><p>Dungeon recruitment and expedition management in <b>one window</b>. In the same vein: right-clicking a social row opens the player's menu, and the party header counts everyone, you included.</p></div><div class="card"><h3>Moderation gets organized <span class="chip c-util">Moderation</span></h3><p>A <b>realm message</b> shown in chat, the GM commands <b>/visible</b>, <b>/watch</b> and <b>/announce</b>, and the spectating moderator's body stays in the world. Regular players only see the result.</p></div></div></section><section id="confort"><h2><span class="num">06</span>Comfort &amp; tech</h2><p class="sec-sub">Mounts change nature, a gift waits at login, and the Membership system is put in place — not purchasable just yet.</p><div class="grid cols-2"><div class="card more" data-detail="mounts" tabindex="0" role="button"><h3>Cosmetic mounts and riding ranks <span class="chip c-new">New</span></h3><p><b>Reins now only provide the look</b> (revocable); training at Marla owns speed and access. Change skins in the saddle — Moonwing, Gloamveil — and the <b>Nightwing Chimaera</b> becomes rideable.</p><span class="more-link">See details</span></div><div class="card"><h3>Release gifts <span class="chip c-util">Gift</span></h3><p>Every existing character receives one <b>available appearance redesign</b> and sees their <b>dungeon and raid lockouts reset</b> (normal and heroic). World bosses and weekly quests are preserved — start fresh without losing anything.</p></div><div class="card more" data-detail="membership" tabindex="0" role="button"><h3>Membership is coming <span class="chip c-new">Announcement</span></h3><p>The subscription infrastructure is in place: <b>30 days</b>, <b>+20% XP</b>, a full seven-piece outfit with its staff, and a courier that opens the <b>whole bank</b>. Purchases open after payment acceptance checks — nothing to do now.</p><span class="more-link">See details</span></div><div class="card more" data-detail="bounties" tabindex="0" role="button"><h3>PvP comfort <span class="chip c-pvp">PvP</span></h3><p>An offensive/defensive <b>cooldown tracker</b> on enemy nameplates, <b>world bounties</b> for flagged kill streaks, a trophy skull and gold on the body, the <b>Skull Bag</b> (500 Honor), and PvP Resurrect now waits <b>15 seconds</b>.</p><span class="more-link">See details</span></div><div class="card"><h3>View and settings <span class="chip c-new">Option</span></h3><p>A <b>first-person camera</b> at the closest zoom (opt-in), <b>Gearscore</b> on the character sheet and inspect window, a graphics preset choice at first launch, <b>Raw Mouse Input</b>, keyboard layout conversion (Turkish Q, Portuguese), and a separate ambience slider.</p></div><div class="card"><h3>Companions <span class="chip c-new">New</span></h3><p><b>Pet commands</b> move to the action bar with an <b>Assist</b> stance; the hunter keeps their pet in delves, the warlock their demon. And a flame-sprite pair, <b>Flicker and Glimmer</b>, joins the companions — with the annual and recruit-a-friend mounts and buddies wired up.</p></div></div></section><div class="note"><b>What it means for you:</b> the game you know changed faces — literally, for the towns and dungeons. Your next login is worth three gifts: a lockout reset to do everything again, an appearance redesign if you want a new look, and — if you main Enhancement or Feral — a bag of gear whose primary stat just flipped. The guild's builds will be re-done on the BiS page once the data settles.</div></div><dialog id="modal" aria-labelledby="mTitle"><div class="modal-head"><h3 id="mTitle"></h3><button class="close" id="mClose" aria-label="Fermer">✕</button></div><div class="modal-body" id="mBody"></div></dialog><script>const DETAILS={
"groveheart":{"title":"The Groveheart reinvented, piece by piece","summary":"The Sporemender Form becomes the healer's signature, and the whole toolbox moves.","body":"<h4>The Sporemender Form</h4><ul><li>A <b>signature</b> form for the healer druid, with its own rigged model (visible in the HUD, icons and the game's wiki).</li><li><b>Spore Burst</b>: a heal placed on the ground, with a damage splash — area healing you drop where the group stands.</li><li>The healing-over-time (the former Wildbloom, renamed <b>Sporemending</b>) sheds legible spores, sparser if you play with reduced motion on.</li></ul><h4>The toolbox</h4><ul><li><b>Typhoon</b> now throws into the air — fall credit for the killer — without inflicting fear, and its throw is bounded.</li><li><b>Slumber</b> gains diminishing returns, <b>Bloodrift</b> doubles its charge, and <b>Dash</b> works from any form.</li><li>The v0.44.1 set (Bloodmane Hide on Strength, 2/4 pieces) remains the base.</li></ul>"},
"hunter":{"title":"The hunter reworked, floor to ceiling","summary":"Total mobility, two new spells, a rewritten Fieldcraft — and the end of minimum ranges.","body":"<h4>Mobility first</h4><ul><li><b>Mobile casts</b> and <b>instant zones</b>: the hunter no longer freezes to play.</li><li><b>No minimum range at all</b>: Auto Shot's dead zone — 8 yards for months, 4 for a moment — disappears completely. Shoot point-blank if you want.</li></ul><h4>The new toys</h4><ul><li><b>Scatterbolt</b>, an exploding crossbow bolt, and <b>Play Dead</b>: the ultimate feint, painted and keyed.</li><li><b>Fieldcraft</b> rewritten from the ground up; <b>Courser</b> and <b>Trailbreak</b> retuned; <b>hidden traps</b> join the arsenal.</li><li><b>Efficient Rhythm</b> and <b>Fang Chorus</b> show their progress on the buff bar.</li></ul>"},
"strength":{"title":"Strength, Agility, Intellect: who wants what","summary":"One table decides every specialization's primary stat — and two specs switch sides.","body":"<h4>The table</h4><ul><li><b>Strength</b>: warrior (3 specs), paladin (Protection, Retribution), shaman <b>Enhancement</b>, druid <b>Feral</b>.</li><li><b>Agility</b>: rogue (3 specs), hunter (3 specs).</li><li><b>Intellect</b>: every caster and every healer.</li></ul><h4>What it means</h4><ul><li>Warrior/paladin/shaman/druid melee gains <b>2 attack power per point of Strength</b> and never reads Agility at all.</li><li>A <b>cat</b> gains <b>nothing</b> from Agility (zero attack power), a <b>bear</b> 1.5 per point. The rogue adds Strength + Agility, and Agility adds crit.</li><li>Enhancement and Feral gear now drops with Strength — Bloodmane Hide announced it back in v0.44.1; all the loot follows.</li><li>In practice: if you main either spec, your bag just got re-typed — the BiS page's builds will be recomputed on the new data.</li></ul>"},
"dungeons":{"title":"Five dungeons, rebuilt in the open air","summary":"Hand-built open sceneries, entrances in the world, and a built-in boss guide.","body":"<h4>The build sites</h4><ul><li><b>Hollow Crypt</b>, <b>Sunken Bastion</b>, <b>Drowned Temple</b>, <b>Wildheart Basin</b> and <b>Gravewyrm Sanctum</b>: remade on authored open-air fields — no more generic corridors.</li><li>The <b>Mere Hydra</b> now counts as a Drowned Temple boss; the Selthe and Zulgar encounters are reworked with playtest feedback.</li><li>The <b>entrances are built in the world</b>: the Wildheart's jaguar maw, the Bastion's portal rid of its sky beam, the Seal Gate redone.</li></ul><h4>For the dungeon runner</h4><ul><li>A built-in <b>boss guide</b> for every five-player dungeon, an <b>objectives tracker</b> with the dungeon's name and a row per boss, and dismissable mechanic alerts.</li><li>On heroic: dedicated health bands and <b>normal minibosses</b> placed under their bosses; the Hollow Crypt gains its own tuning and a boss room <b>sealed for 10 seconds</b>.</li><li>Your <b>ghost returns to the last boss you cleared</b>; mobs need line of sight and walk around walls.</li></ul>"},
"marks":{"title":"Heroic Marks become a currency","summary":"No more bag item that overflowed: a purse balance that pays better and spends.","body":"<h4>What changes</h4><ul><li><b>Heroic Marks</b> are no longer a bag item but a <b>currency</b>: no more stack lost to overflow, a balance you can see and spend.</li><li>A heroic finale pays better: <b>10g</b> nominal in a five-man dungeon (rolls 6–14), <b>20g</b> in the raid (rolls 12–28).</li><li>Old stashes, mail parcels and pending claims stay readable: the currency's id reuses the legacy item.</li></ul><h4>And the anti-farm lock</h4><ul><li>Per-dungeon daily lockouts don't move: heroic gold rewards the legitimate clear, normal mode stays the anti-farm line.</li></ul>"},
"bounties":{"title":"World bounties, hills and Resurrect","summary":"World PvP takes over the bounty system — and the slain can rise again, 15 seconds later.","body":"<h4>Bounties, world edition</h4><ul><li>Five paid kills <b>in a row</b>, without dying, flag up: a <b>bounty sits on your head</b> — everyone can carry their own.</li><li>While it stands, YOUR kills pay more (150%, 100%, 50% Honor on one victim's repeats) and whoever brings you down splits a <b>doubled Honor pool</b>.</li><li>Any death — or dropping the flag — ends the bounty and the streak. Camping still pays nothing: the fourth kill of the same victim inside the window pays nothing.</li></ul><h4>The hills</h4><ul><li>Capture drops to <b>30 seconds</b> that a rival only <b>pauses</b> — no more losing a capture to one step.</li><li>Hold Honor moves to a <b>flat 9 per paid minute</b> — about 390 for a full uncontested stand.</li></ul><h4>Dying in world PvP</h4><ul><li><b>PvP Resurrect</b> is honored after <b>15 seconds</b>: the death screen counts down and names the graveyard — your killer isn't met by a fresh, full-health foe.</li><li>The body drops gold and a stackable <b>trophy skull</b>; the <b>Skull Bag</b> (500 Honor) stores them without eating bag space.</li><li><b>Leaving the world</b> mid-fight counts as a forfeit.</li></ul>"},
"mounts":{"title":"Mounts: looks split from speed","summary":"Reins become a revocable costume; training stays the real passport.","body":"<h4>The new model</h4><ul><li><b>Reins</b> now only give the mount's <b>appearance</b> — revocable: losing reins never removes training.</li><li><b>Training</b> (at Marla) owns speed and access: <b>80g</b> for the basic rank, <b>1,000g</b> for advanced.</li><li>The summon keeps its 1.5s channel, interrupted by combat or water; dismounting stays instant.</li></ul><h4>And the new arrivals</h4><ul><li>Change <b>skins in the saddle</b>: Moonwing and Gloamveil slip on like mount outfits.</li><li>The <b>Nightwing Chimaera</b> becomes rideable, and the Drakemaw Raptor went back through animation (rebuilt in Blender).</li><li>The Valestrider now sells for <b>500 Rift Watch marks</b> (it cost 100g).</li></ul>"},
"membership":{"title":"Membership: what's in, what isn't","summary":"The subscription infrastructure is here, purchases aren't open yet — nothing to do now.","body":"<h4>What the subscription promises</h4><ul><li><b>30 days</b> per subscription, <b>+20% XP</b> throughout.</li><li>A <b>full outfit</b> of seven pieces (helm to boots) and its staff.</li><li>A <b>bank courier</b> that opens the WHOLE bank: the Materials Vault and your other characters' banks.</li></ul><h4>What isn't open yet</h4><ul><li><b>Purchases</b> stay closed pending payment acceptance checks: the infrastructure is in, the store isn't.</li><li>Nothing changes for you as long as you don't buy — the game stays the same.</li></ul>"},
};const modal=document.getElementById('modal'),mTitle=document.getElementById('mTitle'),mBody=document.getElementById('mBody');let lastFocus=null;function openModal(k){const x=DETAILS[k];if(!x)return;lastFocus=document.activeElement;mTitle.textContent=x.title;mBody.innerHTML=(x.summary?'<p class="summary">'+x.summary+'</p>':'')+x.body;if(window.CodexPopup)CodexPopup.enhance(mBody);if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}function closeModal(){if(typeof modal.close==='function')modal.close();else modal.removeAttribute('open');if(lastFocus)lastFocus.focus();}document.querySelectorAll('[data-detail]').forEach(e=>{e.addEventListener('click',()=>openModal(e.dataset.detail));e.addEventListener('keydown',x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();openModal(e.dataset.detail);}})});document.getElementById('mClose').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});modal.addEventListener('cancel',()=>{if(lastFocus)lastFocus.focus();});</script><script src="../assets/codex-popup.js" defer></script><script src="../assets/nav.js"></script><script src="../assets/lang.js"></script><script src="../assets/version.js" data-version="v0.45.0" defer></script></body></html>
