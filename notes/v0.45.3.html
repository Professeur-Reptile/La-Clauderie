<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Nouveautés v0.45.3 — La Clauderie</title><meta name="description" content="Gourdlight Eve : chants de quêtes d'Halloween à Eastbrook, Fenbridge et Highwatch, le balai Emberbristle à gagner, et Old Thatchgrin à défier jusqu'au 1er novembre. Le prêtre Ombre reçoit Vampiric Touch, Void Rupture et la Tithe Bomb. La Guerre recadre les collines."><meta name="theme-color" content="#c8a04b"><meta property="og:type" content="website"><meta property="og:site_name" content="La Clauderie"><meta property="og:title" content="Nouveautés v0.45.3 — La Clauderie"><meta property="og:url" content="https://laclauderie.fr/notes/v0.45.3.html"><link rel="canonical" href="https://laclauderie.fr/notes/v0.45.3.html"><link rel="manifest" href="../manifest.json"><link rel="apple-touch-icon" href="../assets/icon-180.png"><script src="../assets/pwa.js" defer></script><script>if(localStorage.getItem('lang')==='en')location.replace('v0.45.3.en.html'+location.hash);</script><style>
  :root {
    --bg: #0b0d12; --bg-card: #161a24; --bg-card-hover: #1a1f2b; --bg-modal: #12161f;

  .sigil { width: 26px; height: 30px; flex: none; background: linear-gradient(160deg, var(--gold-bright), var(--gold) 55%, #8a6d2e); clip-path: polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%); display: grid; place-items: center; color: #1a130a; font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; }

  @media (max-width: 620px) { .brand b { display: none; } .topnav { gap: 4px 11px; font-size: 0.82rem; } }

  /* Hero */
  .hero { padding: clamp(40px, 7vw, 72px) 0 clamp(24px, 4vw, 40px); border-bottom: 1px solid var(--line-soft); }

  /* Bandeau « En un coup d'œil » — mêmes rubriques, même ordre, à chaque
     version : le lecteur prend l'habitude et trouve sa classe sans lire. */
  .digest { padding: clamp(24px, 3.5vw, 34px) 0 clamp(2px, 1vw, 8px); }

  .digest ol { list-style: none; margin: 0; padding: 0; background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 11px; overflow: hidden; }
  .digest li { display: grid; grid-template-columns: 30px 215px 1fr; align-items: baseline; gap: 3px 12px; padding: 13px 17px; border-top: 1px solid var(--line-soft); }

  .d-ico { font-size: 0.98rem; }

  a.d-name:hover, a.d-name:focus-visible { color: var(--gold-bright); }

  .digest li.none .d-name, .digest li.none .d-say { color: var(--faint); font-weight: 400; }
  /* Sens du changement, d'un coup d'œil : amélioration, nerf, inchangé. */
  .up { color: var(--heal); font-weight: 600; white-space: nowrap; }
  .down { color: var(--dps); font-weight: 600; white-space: nowrap; }
  .eq { color: var(--dim); font-weight: 600; white-space: nowrap; }
  @media (max-width: 620px) {
    .digest li { grid-template-columns: 26px 1fr; padding: 12px 15px; }

  }

  /* Clickable cards */
  .card.more { cursor: pointer; transition: border-color .15s, transform .15s, background .15s; position: relative; }
  .card.more:hover { border-color: var(--gold); transform: translateY(-2px); background: var(--bg-card-hover); }
  .card.more:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .more-link { display: inline-flex; align-items: center; gap: 5px; margin-top: 14px; color: var(--gold-bright); font-size: 0.82rem; font-weight: 600; }
  .more-link::after { content: "→"; transition: transform .15s; }
  .card.more:hover .more-link::after { transform: translateX(3px); }

  /* Chips */
  .chip { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid currentColor; font-weight: 600; white-space: nowrap; }
  .c-new { color: var(--heal); } .c-raid { color: var(--gold); } .c-pvp { color: var(--dps); }
  .c-bal { color: var(--q-legendary); } .c-mob { color: var(--arcane); } .c-epic { color: var(--q-epic); }
  .c-plate { color: var(--dps); } .c-leather { color: var(--heal); } .c-cloth { color: var(--arcane); } .c-util { color: var(--q-rare); }

  .statline { display: flex; flex-wrap: wrap; gap: 5px 16px; margin-top: 12px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--dim); }
  .statline b { color: var(--text); }
  .grp-title { font-family: var(--font-display); font-size: 1rem; color: var(--dim); margin: 22px 0 12px; }
  .compact { columns: 2; column-gap: 34px; }
  .compact li { margin: 5px 0; }
  @media (max-width: 560px) { .compact { columns: 1; } }
  strong.hl { color: var(--text); font-weight: 600; }

  /* Modal */
  dialog { padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-modal); color: var(--text); max-width: 640px; width: calc(100% - 28px); max-height: 86vh; box-shadow: 0 30px 80px rgba(0,0,0,0.6); }
  dialog::backdrop { background: rgba(4,6,10,0.72); backdrop-filter: blur(3px); }
  .modal-head { position: sticky; top: 0; background: linear-gradient(180deg, var(--bg-modal), color-mix(in srgb, var(--bg-modal) 88%, transparent)); border-bottom: 1px solid var(--line-soft); padding: 18px 22px; display: flex; align-items: flex-start; gap: 14px; }
  .modal-head h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; margin: 0; line-height: 1.15; }
  .modal-head .close { margin-left: auto; flex: none; background: var(--bg-card); border: 1px solid var(--line); color: var(--dim); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; line-height: 1; }
  .modal-head .close:hover { color: var(--text); border-color: var(--gold); }
  .modal-body { padding: 20px 22px 26px; overflow-y: auto; }
  .modal-body .summary { color: var(--dim); font-style: italic; margin: 0 0 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line-soft); }
  .modal-body h4 { font-family: var(--font); font-weight: 700; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold-bright); margin: 22px 0 8px; }
  .modal-body h4:first-of-type { margin-top: 0; }
  .modal-body p { margin: 0 0 10px; font-size: 0.94rem; color: var(--text); }
  .modal-body ul { margin: 0 0 10px; padding-left: 1.15em; }
  .modal-body li { margin: 6px 0; font-size: 0.93rem; }
  .modal-body li::marker { color: var(--gold); }
  .modal-body b { color: var(--gold-bright); font-weight: 600; }
  .kbd { font-family: var(--font-mono); background: var(--bg-card); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-size: 0.85em; color: var(--text); }

  .note { margin-top: 8px; background: color-mix(in srgb, var(--gold) 8%, transparent); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 11px; padding: 16px 19px; color: var(--dim); font-size: 0.94rem; }

  footer { border-top: 1px solid var(--line-soft); padding: 28px 0 54px; color: var(--faint); font-size: 0.82rem; text-align: center; }

<body><div class="topbar"><div class="row"><a href="../index.html" class="brand"><span class="sigil">C</span><b>La Clauderie</b></a><nav class="topnav" data-guild-nav data-current="news" aria-label="Navigation du site"></nav></div></div><div class="wrap"><header class="hero"><p class="eyebrow">World of ClaudeCraft · Notes de version</p><h1>Nouveautés <span class="v">v0.45.3</span></h1><p class="lede"><strong class="hl">Gourdlight Eve</strong>, l’événement d’automne : des bonbons à récolter dans trois villes, un balai volant à gagner et l’épouvantail Old Thatchgrin à abattre chaque jour — jusqu’au <strong class="hl">1er novembre à 12 h UTC</strong>. Le <strong class="hl">prêtre Ombre</strong> reçoit sa mise à jour, et la Guerre recadre ses collines.</p><div class="meta"><span><b>Publiée</b> le 27 octobre 2026</span><span><b>Depuis</b> v0.45.2</span><span><b>Événement + classe</b></span></div><div class="hint">💡 Clique sur une carte pour le détail.</div></header><nav class="digest" aria-labelledby="digest-title"><h2 id="digest-title">En un coup d’œil</h2><p class="sec-sub">Les mêmes rubriques à chaque version, dans le même ordre.</p><ol><li class=""><span class="d-ico">⚔️</span><a class="d-name" href="#classes">Classes &amp; sorts</a><span class="d-say"><b class="up">Prêtre Ombre ↑</b> Vampiric Touch, Void Rupture, Tithe Bomb et un médaillon Gloomtithe.</span></li><li class="none"><span class="d-ico">🔨</span><a class="d-name" href="#metiers">Métiers &amp; récolte</a><span class="d-say">—</span></li><li class=""><span class="d-ico">🐉</span><a class="d-name" href="#donjons">Donjons, failles &amp; boss</a><span class="d-say">Butin des boss crédité une seule fois ; les tirages se règlent avant de changer de difficulté.</span></li><li class=""><span class="d-ico">🗺️</span><a class="d-name" href="#monde">Monde &amp; quêtes</a><span class="d-say"><b class="up">Gourdlight Eve ↑</b> tournée des bonbons, citrouilles hantées et Thatchgrin quotidien.</span></li><li class=""><span class="d-ico">🏰</span><a class="d-name" href="#guilde">Guilde &amp; social</a><span class="d-say"><b class="up">Collines ↑</b> retour au rythme 2 h/30 min ; les primes monde et colline s’additionnent.</span></li><li class=""><span class="d-ico">⚙️</span><a class="d-name" href="#confort">Confort &amp; technique</a><span class="d-say">Le preset graphique Bas éclaire mieux le jour comme dans le noir.</span></li></ol></nav><section id="classes"><h2><span class="num">01</span>Classes &amp; sorts : le prêtre Ombre passe à la marmite</h2><p class="sec-sub">Trois nouveaux sorts et une ressource à gérer : le kit Ombre a désormais son moteur à gemmes.</p><div class="grid cols-2"><div class="card more" data-detail="ombre" tabindex="0" role="button"><h3>Vampiric Touch, Void Rupture, Tithe Bomb <span class="chip c-new">Nouveau</span></h3><p>Un <b>DoT</b> qui partage les soins, une <b>rupture</b> instantanée qui consomme 3 gemmes, et une <b>bombe</b> de zone préparée avec 20 Gloomtithe générés — le tout suivi sur un médaillon déplaçable.</p><span class="more-link">Voir le détail</span></div><div class="card"><h3>Le médaillon Gloomtithe <span class="chip c-new">Interface</span></h3><p>Un médaillon <b>déplaçable et redimensionnable</b> affiche tes cinq gemmes Gloomtithe et la progression de la Tithe Bomb séparément — plus besoin de deviner ce qui est prêt.</p></div></div></section><section id="metiers"><h2><span class="num">02</span>Métiers &amp; récolte</h2><p class="sec-sub">Rien de neuf côté métiers — mais l’événement glisse des bonbons dans les rayons.</p><div class="grid cols-3"><div class="card"><h3>Les bonbons de Hester <span class="chip c-util">Événement</span></h3><p>Cinq sucreries de Gourdlight Eve sont de la <b>nourriture ordinaire</b> (miroir du palier d’entrée de cuisine) : du bien-être, pas du progrès permanent.</p></div></div></section><section id="donjons"><h2><span class="num">03</span>Donjons, failles &amp; boss</h2><p class="sec-sub">Des récompenses qui se règlent proprement, et un coffre qui ne paie plus deux fois.</p><div class="grid cols-2"><div class="card"><h3>Les tirages se règlent <span class="chip c-util">Correctif</span></h3><p>Les <b>tirages de butin</b> des boss terminés se règlent maintenant correctement : le groupe peut <b>changer de difficulté</b> sans laisser une récompense en suspens.</p></div><div class="card"><h3>Un mort, un butin <span class="chip c-util">Correctif</span></h3><p>La mort d’un boss n’attribue <b>qu’une fois</b> le butin, le crédit de kill et les tirages de compagnon — même quand des effets de mort s’enchaînent. Et les Shardpike de Skerrit rechargeables ne rendent plus de matériaux au recyclage ni à l’enchantement.</p></div></div></section><section id="monde"><h2><span class="num">04</span>Monde &amp; quêtes : Gourdlight Eve</h2><p class="sec-sub">L’événement d’automne s’installe dans trois villes, jusqu’au 1er novembre à 12 h UTC.</p><div class="grid cols-2"><div class="card more" data-detail="gourdlight" tabindex="0" role="button"><h3>Tournée des bonbons et citrouilles <span class="chip c-new">Événement</span></h3><p><b>Des bonbons ou un sort</b> à Eastbrook, Fenbridge et Highwatch, des quêtes quotidiennes tournantes chez <b>Hester Gourdwick</b>, des <b>Citrouilles hantées</b> à débusquer — et l’épouvantail <b>Old Thatchgrin</b> qui se relève chaque jour.</p><span class="more-link">Voir le détail</span></div><div class="card more" data-detail="balai" tabindex="0" role="button"><h3>Le balai Emberbristle <span class="chip c-new">Monture</span></h3><p>La récompense phare : un <b>balai volant</b> qui reste à toi toute l’année. Cinq Gerbes Emberwoven chez Hester — une par Thatchgrin quotidien — ou 3 % de chances qu’il te le lâche directement.</p><span class="more-link">Voir le détail</span></div><div class="card"><h3>Ce qui reste, ce qui s’efface <span class="chip c-util">Règles</span></h3><p>Tout ce que tu gagnes (balai, jouets, cosmétiques, exploits, titres) reste <b>après l’événement</b> ; les quêtes d’événement inachevées et les consommables temporaires sont effacés à la fermeture ou à ta prochaine connexion.</p></div><div class="card"><h3>Marqueurs à l’horizon <span class="chip c-new">Interface</span></h3><p>Les <b>marqueurs de quête</b> restent visibles sur les PNJ lointains, quand leurs noms et rôles ne s’affichent toujours qu’à courte portée.</p></div></div></section><section id="guilde"><h2><span class="num">05</span>Guilde &amp; social : les collines recadrent</h2><p class="sec-sub">Le rythme d’avant fait son retour, et les deux primes s’empilent enfin.</p><div class="grid cols-2"><div class="card"><h3>Retour au 2 h / 30 min <span class="chip c-util">Ajustement</span></h3><p>Le Roi de la colline reprend son rythme : <b>une colline toutes les 2 heures, debout 30 minutes</b> — la capture reste à 30 secondes qu’un rival ne fait que mettre en pause.</p></div><div class="card"><h3>Les primes s’additionnent <span class="chip c-pvp">JcJ</span></h3><p>Les <b>primes mondiales</b> (ta série de kills flagué) et les <b>primes de colline</b> (la prime sur ta tête) <b>s’empilent</b> : porter les deux, c’est payer le double à qui t’abat. Et se déconnecter après du JcJ mondial laisse ton personnage sur le terrain pendant le temps de maintien du combat — un autre personnage ne peut pas l’effacer, seul le même personnage peut se reconnecter dessus.</p></div></div></section><section id="confort"><h2><span class="num">06</span>Confort &amp; technique</h2><p class="sec-sub">Le preset Bas se refait une beauté, et les traductions suivent.</p><div class="grid cols-2"><div class="card"><h3>Le preset Bas éclaire <span class="chip c-new">Graphismes</span></h3><p>Éclairage de jour amélioré, <b>zones sombres et raids plus lisibles</b>, chemins plus lisibles, berges plus douces et une eau mieux rendue : le mode Bas redevient un vrai choix, pas une punition.</p></div><div class="card"><h3>Traductions <span class="chip c-util">Langues</span></h3><p>Les textes de la version (dont Gourdlight Eve et l’Adhésion) sont complétés dans toutes les langues, avec la localisation générée rafraîchie.</p></div></div></section><div class="note"><b>Ce que ça change pour toi :</b> l’événement ferme le 1er novembre à 12 h UTC : le balai demande cinq gerbes, une par Thatchgrin quotidien — et les gerbes non dépensées se gardent pour le prochain événement. Prêtre Ombre : ta rotation change, la page DPS sera recalculée avec les nouveaux chiffres dès la simulation passée.</div></div><dialog id="modal" aria-labelledby="mTitle"><div class="modal-head"><h3 id="mTitle"></h3><button class="close" id="mClose" aria-label="Fermer">✕</button></div><div class="modal-body" id="mBody"></div></dialog><script>const DETAILS={
"gourdlight":{"title":"Gourdlight Eve, le déroulé","summary":"Des bonbons ou un sort dans trois villes, des dailies tournantes et un épouvantail à abattre chaque jour.","body":"<h4>Le circuit</h4><ul><li><b>Des bonbons ou un sort</b> : frappe aux portes d’Eastbrook, Fenbridge et Highwatch — les habitants répondent par une friandise ou une farce.</li><li><b>Hester Gourdwick</b> propose des quêtes quotidiennes tournantes, et des <b>Citrouilles hantées</b> se cachent dans le décor à débusquer.</li><li><b>Old Thatchgrin</b>, l’épouvantail Old Thatchgrin se relève chaque jour : un vrai boss quotidien, avec son verrou quotidien.</li></ul><h4>La monnaie et les jouets</h4><ul><li>La <b>bonbon emballé</b> de récolte s’empile à volonté ; la petite boutique de l’événement vend jouets, cosmétiques et exploits.</li><li>Les <b>potions de costume</b> t’habillent en squelette, en fantôme ou en chauve-souris pendant 10 minutes — pur visuel, refusé en combat.</li><li>Les cinq <b>bonbons</b> de l’étagère sont de la nourriture ordinaire (miroir du palier d’entrée de cuisine) : jamais meilleur que ce qu’un cuisinier prépare.</li></ul><h4>La fin de l’événement</h4><ul><li>L’événement ferme le <b>1er novembre à 12 h UTC</b>.</li><li>Gagné, acquis : balai, jouets, cosmétiques, exploits et titres restent à toi après l’événement.</li><li>Les quêtes d’événement inachevées et les consommables temporaires sont effacés à la fermeture ou à ta prochaine connexion.</li></ul>"},
"balai":{"title":"Le balai Emberbristle, mode d’emploi","summary":"Cinq jours de Thatchgrin chez Hester — ou 3 % de chances qu’il te le lâche tout cru.","body":"<h4>Les deux routes</h4><ul><li><b>La route lente</b> : Old Thatchgrin paie une <b>Gerbe Emberouée</b> par jour (verrou quotidien, jamais à un personnage qui garde déjà le balai). Cinq Gerbes ouvrent l’achat chez Hester.</li><li><b>La route rapide</b> : chaque Thatchgrin quotidien tué a <b>3 %</b> de chances de lâcher les rênes directement.</li><li>Les Gerbes non dépensées <b>se gardent</b> pour le prochain événement.</li></ul><h4>Le balai lui-même</h4><ul><li>Un balai qui <b>survole</b> le sol — une apparence de monture, permanente et utilisable toute l’année.</li><li>Comme toutes les montures depuis la v0.45.0, la vitesse vient de ton <b>rang d’équitation</b>, pas du balai.</li></ul>"},
"ombre":{"title":"Le prêtre Ombre, moteur à gemmes","summary":"Vampiric Touch, Void Rupture et Tithe Bomb autour d’une ressource à cinq gemmes.","body":"<h4>La ressource</h4><ul><li>Les <b>Gloomtithe</b> : cinq charges au maximum, affichées sur un médaillon déplaçable et redimensionnable.</li><li><b>Vampiric Touch</b> : un DoT de 15 s (un tick toutes les 3 s) dont chaque tick partage en soins 20 % de la vie perdue par l’ennemi autour de toi. Avec au moins 2 charges, il en consomme pour frapper <b>30 % plus fort</b>.</li></ul><h4>Les dépensiers</h4><ul><li><b>Void Rupture</b> : consomme 3 charges pour une <b>rupture instantanée</b> — le coup de mobilité du kit, plus faible que le Touch par gemme mais immédiat.</li><li><b>Tithe Bomb</b> : prépare une bombe avec <b>20 Gloomtithe générés</b> (la génération compte même gemmes pleines), puis la détone sur une cible : <b>dégâts de zone dans 8 m</b>, réduits au-delà de 5 cibles.</li><li>La progression de la bombe <b>survit entre les combats</b> (jusqu’à une bombe prête) ; mourir la vide, et un boss de raid la remet à zéro à l’engagement.</li></ul>"},
};const modal=document.getElementById('modal'),mTitle=document.getElementById('mTitle'),mBody=document.getElementById('mBody');let lastFocus=null;function openModal(k){const x=DETAILS[k];if(!x)return;lastFocus=document.activeElement;mTitle.textContent=x.title;mBody.innerHTML=(x.summary?'<p class="summary">'+x.summary+'</p>':'')+x.body;if(window.CodexPopup)CodexPopup.enhance(mBody);if(typeof modal.showModal==='function')modal.showModal();else modal.setAttribute('open','');}function closeModal(){if(typeof modal.close==='function')modal.close();else modal.removeAttribute('open');if(lastFocus)lastFocus.focus();}document.querySelectorAll('[data-detail]').forEach(e=>{e.addEventListener('click',()=>openModal(e.dataset.detail));e.addEventListener('keydown',x=>{if(x.key==='Enter'||x.key===' '){x.preventDefault();openModal(e.dataset.detail);}})});document.getElementById('mClose').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});modal.addEventListener('cancel',()=>{if(lastFocus)lastFocus.focus();});</script><script src="../assets/codex-popup.js" defer></script><script src="../assets/nav.js"></script><script src="../assets/lang.js"></script><script src="../assets/version.js" data-version="v0.45.3" defer></script></body></html>
